.sortbox .inp{height:100%;border-radius:14px;background-color:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fchip .n{opacity:.65;font-weight:500;margin-inline-start:5px}

/* ---------- product cards */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:720px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:1060px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;transition:border-color .18s,box-shadow .18s,transform .18s;min-width:0}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.pcard:has(.pc-link:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.pbadge{font:700 11.5px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.pbadge.sale{background:var(--bad-bg);color:var(--bad)}
.pc-name{margin:0;font:700 16px/1.35 var(--f-display);min-width:0}
.pc-link{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;width:100%;text-align:start;font:inherit;color:inherit;overflow:hidden;overflow-wrap:anywhere}
.pc-link::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1}
.pc-link:focus-visible{outline:none}
.pc-meta{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-plans{display:flex;gap:4px;overflow:hidden;margin-top:2px}
.pc-plans span{font-size:11.5px;font-weight:600;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:8px;white-space:nowrap}
.pc-foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:10px}
.pc-price{display:grid;line-height:1.15;min-width:0}
.pc-price b{font:800 22px/1.15 var(--f-display);color:var(--price)}
.ibtn{position:relative;z-index:2;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);flex:none}
.ibtn:hover{border-color:var(--brand);color:var(--brand)}
.pc-buy{position:relative;z-index:2;margin-top:10px}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:18px;padding:26px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:16px}
.empty .i{color:var(--muted)}

/* ---------- how / pay / reviews / faq / cta */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.step-n{grid-row:span 2;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--brand);color:#fff;font:800 18px/1 var(--f-display)}
.steps b{font:700 16px/1.4 var(--f-display)}
.steps p{margin:0;color:var(--muted);font-size:14px}
.paygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.paycard{display:flex;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0}
.paycard span{display:grid;min-width:0}
.paycard b{font:700 15.5px/1.35 var(--f-display)}
.paycard small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.revgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rev{margin:0;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:grid;gap:14px;align-content:space-between}
.rev blockquote{margin:0;color:var(--fg-2);font-size:15px}
.rev figcaption{display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:800 15px/1 var(--f-display);flex:none}
.rev figcaption b{display:block;font:700 14px/1.3 var(--f-display)}
.rev figcaption small{color:var(--muted);font-size:12.5px}
.faq{display:grid;gap:10px;max-width:860px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.faq details[open]{border-color:var(--line-2)}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;font:700 15.5px/1.45 var(--f-display)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .i{transition:transform .2s;color:var(--muted)}
.faq details[open] summary .i{transform:rotate(180deg)}
.faq details p{margin:0 0 16px;color:var(--fg-2)}
.seo{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:grid;gap:12px}
.seo h2{margin:0;font:800 clamp(20px,4vw,26px)/1.35 var(--f-display)}
.seo h2 span{color:var(--muted);font-weight:600}
.seo p{margin:0;color:var(--fg-2);max-width:75ch}
.seo-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.seo-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13.5px}
.seo-list b{font-weight:700}
.seo-list span{color:var(--muted);font-size:12.5px}
.cta{margin-top:60px;background:var(--navy);color:#fff;border-radius:26px;padding:28px 22px;display:grid;gap:18px;position:relative;overflow:hidden;isolation:isolate}
.cta::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(520px 260px at 90% 0%,rgba(11,78,224,.6),transparent 70%)}
.cta h2{margin:0;font:800 clamp(21px,4vw,28px)/1.35 var(--f-display);text-wrap:balance}
.cta p{margin:6px 0 0;color:var(--on-navy-2)}
.cta-act{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (min-width:760px){.cta{grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:36px 40px}}
.foot{margin-top:60px;background:var(--surface);border-top:1px solid var(--line);padding-block:36px calc(96px + env(safe-area-inset-bottom,0px))}
.foot-grid{display:grid;gap:28px}
@media (min-width:860px){.foot-grid{grid-template-columns:1.5fr 1fr 1.3fr}}
.foot h3{margin:0 0 10px;font:700 14.5px/1.3 var(--f-display)}
.foot p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:46ch}
.flinks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.flinks a{color:var(--fg-2);text-decoration:none;font-size:14px}
.flinks a:hover{color:var(--brand)}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sel{user-select:all;-webkit-user-select:all;font-weight:700;color:var(--fg)}
.foot-pay{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.foot-bottom{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
.admin-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:10px}
.admin-link:hover{color:var(--brand);border-color:var(--brand)}
.fab{position:fixed;z-index:25;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:13px 18px 13px 16px;border-radius:999px;box-shadow:0 12px 26px -10px rgba(21,128,61,.75)}
.fab:hover{background:var(--wa-hi)}
.mnav{display:grid;gap:4px}
.mnav a{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600;font-size:16px;border:1px solid var(--line)}

/* ---------- buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:600;font-size:14.5px;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover{border-color:var(--fg-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hi);border-color:var(--brand-hi)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:var(--wa-hi);border-color:var(--wa-hi)}
.btn.light{background:#fff;color:#0a1433;border-color:#fff}
.btn.light:hover{background:#e8efff;border-color:#e8efff}
.btn.ghost-l{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.24)}
.btn.ghost-l:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.block{width:100%}
.btn.lg{padding:14px 20px;font-size:15.5px;border-radius:14px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:default}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--fg-2)}
.field>span em{font-style:normal;font-weight:400;color:var(--muted)}
.inp{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:16px;color:var(--fg);outline:none}
.inp:focus{border-color:var(--focus);background:var(--surface)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.55}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:16px 52%,21px 52%;background-size:5px 5px;background-repeat:no-repeat;padding-left:34px}
.inp.ltr{direction:ltr;text-align:right}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.hint{margin:0;color:var(--muted);font-size:13px}
.err{margin:0;background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.fine{margin:0;color:var(--muted);font-size:12.5px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--warn-bg);color:var(--warn)}
.pill.done{background:var(--good-bg);color:var(--good)}
.pill.cancelled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.info{background:var(--brand-soft);color:var(--brand)}

/* ---------- sheets */
.ov{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:600px;max-height:calc(100dvh - 18px - env(safe-area-inset-top,0px));overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;animation:up .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sh-head{position:sticky;top:0;z-index:4;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font:700 17px/1.3 var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-body{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
@media (min-width:720px){.ov{align-items:center;padding:24px}.sheet{border-radius:24px;border-bottom:1px solid var(--line);max-height:calc(100dvh - 48px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg-2);border:1px solid var(--line);background:var(--surface);flex:none;text-decoration:none}
.icon-btn:hover{color:var(--fg);border-color:var(--line-2)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.icon-btn:disabled{opacity:.4}
.pd-head{display:flex;gap:14px;align-items:center}
.pd-head h3{margin:0;font:800 21px/1.3 var(--f-display)}
.pd-head span{display:grid;min-width:0}
.pd-desc{margin:0;color:var(--fg-2)}
.ostep{display:grid;gap:10px}
.ostep h3,.ostep h4{margin:0;display:flex;align-items:center;gap:8px;font:700 15px/1.3 var(--f-display)}
.sn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:700 12.5px/1 var(--f-display);flex:none}
.plans{display:grid;gap:8px}
.plan{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--surface);text-align:start}
.plan[aria-checked="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.plan[aria-checked="true"] .radio{border-color:var(--brand)}
.plan[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.pl-n{flex:1;font-weight:700;font-size:15px;min-width:0}
.pl-p{display:flex;align-items:baseline;gap:8px;font:800 17px/1.2 var(--f-display);color:var(--price)}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feat li{display:flex;gap:8px;align-items:flex-start;color:var(--fg-2)}
.feat .i{color:var(--good);margin-top:4px}
.pd-foot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:10px;background:var(--surface);border-top:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) calc(-22px - env(safe-area-inset-bottom,0px)) calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pd-foot .btn.primary{flex:1}
.co-sum{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.co-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.ci-info{flex:1;min-width:0;display:grid}
.ci-info b{font:600 14.5px/1.35 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-info small{color:var(--muted);font-size:12.5px}
.co-item>.money{font-weight:700}
.co-total{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--surface-2);font-weight:700}
.co-total .money{font:800 22px/1.1 var(--f-display);color:var(--price)}
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.method{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--surface);text-align:start;font-weight:600;font-size:14px;min-width:0}
.method span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.method[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.paybox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:12px;color:var(--muted);grid-column:1}
.kv .v{font:700 16px/1.35 var(--f-display);grid-column:1;overflow-wrap:anywhere}
.kv .copy{grid-column:2;grid-row:1/span 2}
.copy{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--fg-2)}
.copy.ok{color:var(--good);border-color:var(--good)}
.paynote{margin:0;padding:10px 12px;font-size:13px;color:var(--fg-2);background:var(--surface)}
.upl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.done{display:grid;gap:12px;justify-items:center;text-align:center;padding-block:8px}
.done-ic{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:var(--good-bg);color:var(--good)}
.done h3{margin:0;font:800 22px/1.3 var(--f-display)}
.done p{margin:0;color:var(--fg-2)}
.clist{display:grid;gap:10px}
.citem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px}
.ci-price{font-weight:700;color:var(--price)}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:12px;padding:2px}
.qty button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--fg-2)}
.qty button:hover{background:var(--surface-2)}
.qty span{min-width:22px;text-align:center;font-weight:700}
.ctotal{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;background:var(--surface-2);font-weight:700}
.ctotal .money{font:800 22px/1.1 var(--f-display);color:var(--price)}
.ask-t{margin:0;color:var(--fg-2)}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);animation:up .2s ease}
.toast button{color:var(--bg);font-weight:800;text-decoration:underline;white-space:nowrap}

/* ---------- login */
.login{min-height:100vh;display:grid;place-items:center;align-content:center;gap:16px;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--navy) 0,var(--navy) 300px,var(--bg) 300px)}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.login-ic{width:80px;height:80px;border-radius:22px;justify-self:center;box-shadow:0 14px 28px -12px rgba(11,78,224,.6)}
.login-card h1{margin:0;text-align:center;font:800 22px/1.35 var(--f-display)}
.login-card>p{margin:0;text-align:center}
.login-foot{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px}
.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px}
.alert>span{display:flex;align-items:center;gap:8px}
.alert.info{background:var(--brand-soft);color:var(--fg-2);font-weight:500}
.alert.info .i{color:var(--brand)}

/* ---------- admin layout */
.adm{min-height:100vh}
@media (min-width:960px){.adm{display:grid;grid-template-columns:268px minmax(0,1fr)}}
.side{display:none}
@media (min-width:960px){.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-inline-end:1px solid var(--line);padding:22px 14px}}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 6px;min-width:0}
.side-brand img{width:44px;height:44px;border-radius:12px;flex:none}
.side-brand span{display:grid;min-width:0;line-height:1.25}
.side-brand b{font:800 16px/1.25 var(--f-display)}
.side-brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-nav{display:grid;gap:4px;margin-top:10px}
.snav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--fg-2);font-weight:600;font-size:14.5px;text-decoration:none;width:100%;text-align:start}
.snav:hover{background:var(--surface-2);color:var(--fg)}
.snav[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.snav .cnt{margin-inline-start:auto;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;line-height:22px;text-align:center;padding:0 6px}
.side-foot{margin-top:auto;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:10px;margin-bottom:6px}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.conn.on{color:var(--good);background:var(--good-bg)}
.conn.off{color:var(--warn);background:var(--warn-bg)}
.atop{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.atop-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.atop .side-brand{padding:0}
.atop .side-brand img{width:40px;height:40px;border-radius:11px}
.top-actions{display:flex;gap:8px}
@media (min-width:960px){.atop{display:none}}
.amain{display:grid;gap:16px;align-content:start;width:100%;max-width:1160px;margin-inline:auto;padding-block:20px calc(112px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:960px){.amain{padding-block:28px 56px;padding-left:32px;padding-right:32px}}
.anav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
.anav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.anav button{display:grid;justify-items:center;gap:3px;padding:9px 2px 10px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.anav button[aria-current="page"]{color:var(--brand)}
.anav .dot{position:absolute;top:5px;left:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
@media (min-width:960px){.anav{display:none}}
.a-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.a-h h1{margin:0;font:800 24px/1.3 var(--f-display)}
.a-h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;min-width:0}
.card>h2,.card-h h2{margin:0;font:700 16px/1.3 var(--f-display)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.setup{grid-template-columns:auto minmax(0,1fr);align-items:start;border-color:color-mix(in srgb,var(--warn) 35%,var(--line));background:linear-gradient(0deg,var(--warn-bg),var(--warn-bg)),var(--surface)}
.setup-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--warn);border:1px solid var(--line)}
.setup h2{margin:0;font:700 16px/1.4 var(--f-display)}
.setup p{margin:4px 0 0;color:var(--fg-2);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:6px;align-content:start;min-width:0}
.kpi.big{grid-column:1/-1;padding:18px;gap:8px;box-shadow:var(--shadow)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;flex-wrap:wrap}
.kpi .lbl{font:700 14px/1.3 var(--f-display);white-space:nowrap}
.kpi .date{font-size:12px;color:var(--muted)}
.kpi .val{font:800 28px/1.1 var(--f-body);letter-spacing:-.5px}
.kpi.big .val{font-size:46px}
.kpi .cap{font-size:12.5px;color:var(--muted)}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 0;border-top:1px solid var(--line);padding-top:12px}
.kgrid div{display:grid;gap:2px;min-width:0}
.kgrid dt{font-size:11.5px;color:var(--muted)}
.kgrid dd{margin:0;font-weight:700;font-size:15px}
.ksub{display:grid;gap:3px;font-size:12.5px;color:var(--fg-2)}
.cmp{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
@media (min-width:760px){.kpis{grid-template-columns:2fr 1fr 1fr}.kpi.big{grid-column:auto}}
@media (max-width:420px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dgrid{display:grid;gap:16px;align-items:start}
@media (min-width:860px){.dgrid{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.chart-cap{font-size:13px;color:var(--fg-2);min-height:20px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .hit{fill:transparent;cursor:pointer}
.chart .axis{fill:var(--muted);font:500 11px var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--bar-soft)}
.chart .bar.today{fill:var(--brand)}
.chart .bar.neg{fill:var(--bad)}
.chart .bar.sel{fill:var(--cyan)}
.chart-empty{display:grid;justify-items:center;gap:8px;text-align:center;color:var(--muted);font-size:13.5px;padding:28px 12px;border:1px dashed var(--line-2);border-radius:14px}
.toplist{display:grid;gap:10px}
.tp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.tp .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp .meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.tp .meter i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.olist{display:grid;gap:8px}
.oday{font:700 13px/1.3 var(--f-display);color:var(--muted);margin:10px 2px 0;display:flex;justify-content:space-between}
.orow{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:start}
.orow:hover{border-color:var(--line-2)}
.orow>.tile{grid-row:1/span 2}
.orow .t{font:600 15px/1.35 var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.orow .m{grid-column:2;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.orow .amt{display:grid;justify-items:end;gap:2px;grid-row:1/span 2;grid-column:3}
.orow .amt .money{font-weight:700;font-size:16px}
.orow .amt small{font-size:12px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.arow.off{opacity:.62}
.arow .pinfo{display:grid;gap:2px;min-width:0;cursor:pointer}
.pname{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:700 15.5px/1.35 var(--f-display)}
.pmeta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptable{grid-column:1/-1;display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pt-r{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr));gap:6px;padding:8px 10px;align-items:center;font-size:13.5px}
.pt-r+.pt-r{border-top:1px solid var(--line)}
.pt-r.h{background:var(--surface-2);font-size:11.5px;color:var(--muted);font-weight:600}
.pt-r>span:first-child{font-weight:600;font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}
.pt-r b{font-variant-numeric:tabular-nums;font-weight:700}
.mini-link{color:var(--warn);font-weight:700;font-size:12.5px;text-decoration:underline}
.list-plain{display:grid;gap:10px}
.psec{display:grid;gap:10px}
.psec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 0}
.psec-h h2{margin:0;font:700 16px/1.3 var(--f-display)}
.psec-h span{font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.picker button{height:44px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--fg-2);background:var(--surface-2)}
.picker button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.preview{display:flex;gap:12px;align-items:center;padding:12px;border:1px dashed var(--line-2);border-radius:16px;min-width:0}
.preview .pinfo{display:grid;min-width:0;flex:1}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.calc div{display:grid;gap:2px}
.calc small{font-size:11.5px;color:var(--muted)}
.calc b{font-size:17px;font-variant-numeric:tabular-nums}
.fsec{display:grid;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.fsec>h3{margin:0;font:700 15px/1.3 var(--f-display)}
.plrow,.lrow,.srow{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;background:var(--surface-2)}
.plrow-top,.lrow-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.lrow-h{align-items:center}
.lrow-h b{font:700 13.5px var(--f-display);color:var(--fg-2)}
.plcalc{font-size:12.5px;color:var(--muted)}
.srow-h{display:flex;align-items:center;gap:10px}
.srow-h span{display:grid;min-width:0}
.srow-h b{font:600 14.5px/1.3 var(--f-display)}
.srow-h small{color:var(--muted);font-size:12.5px}
.kvlist{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kvlist div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.kvlist div:last-child{border-bottom:0}
.kvlist>div>span{color:var(--muted)}
.kvlist b{text-align:left;overflow-wrap:anywhere}
.big-img{width:100%;border-radius:14px;border:1px solid var(--line)}
.stack{display:grid;gap:10px}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:flex-end;gap:8px;padding:10px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px}
@media (min-width:960px){.savebar{bottom:16px}}
.skel{height:68px;border-radius:16px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

/* ---------- accounts, balance & instant delivery */
.udot{position:absolute;top:6px;left:6px;width:10px;height:10px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}
.pc-inst{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--good);background:var(--good-bg);padding:3px 8px;border-radius:8px}
.pl-inst{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--good);background:var(--good-bg);padding:2px 7px;border-radius:7px;vertical-align:middle;white-space:nowrap}
.inst-hint{display:flex;gap:6px;align-items:flex-start;color:var(--good)}
.inst-hint .i{margin-top:3px}
.wcard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;isolation:isolate}
.wcard::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(360px 200px at 100% 0,rgba(11,78,224,.7),transparent 70%)}
.wcard>div{display:grid;gap:2px;min-width:0}
.wcard small{color:var(--on-navy-2);font-size:13px}
.wcard b{font:800 34px/1.15 var(--f-display);color:#fff}
.wcard span{color:var(--on-navy-2);font-size:12.5px;overflow-wrap:anywhere}
.wbox{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.wbox.low{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-bg)}
.wbox p{margin:0}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.wrow b{font-weight:700}
.wlow{color:var(--warn);font-weight:700}
.mrow{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.mrow-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mrow-h b{font:600 15px/1.35 var(--f-display);min-width:0}
.mrow-m{font-size:12.5px;color:var(--muted)}
.mrow .hint{font-size:12.5px}
.codebox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--good) 55%,var(--line));border-radius:12px;background:var(--good-bg)}
.codebox small{grid-column:1/-1;color:var(--good);font-weight:700;font-size:12px}
.codebox pre,.crow pre,.codev{margin:0;font:600 14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;color:var(--fg)}
.codev{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.crow pre{flex:1;min-width:0}
.crow.used{opacity:.8;flex-direction:column;align-items:stretch;gap:2px}
.crow small{color:var(--muted);font-size:12px}
.plinst{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.pill.paid{background:var(--brand-soft);color:var(--brand)}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k3 .val{font-size:22px}
.kpis.k3 .lbl{white-space:normal;font-size:13px}
.orow>.av{grid-row:1/span 2}

/* ===== WhatsApp sales */
.s-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.s-top .icon-btn{margin-bottom:3px}
.s-foot{display:flex;justify-content:space-between;align-items:center;gap:4px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2)}
.s-foot:not(:has(span:not(:empty))){display:none}
.s-last{color:var(--brand);font-weight:600}
.s-add{justify-self:start}
.sf-tip{margin-top:-4px}
.srcsplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.srcsplit .src{display:flex;align-items:center;gap:8px;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--fg-2);font:inherit;text-align:start}
.srcsplit button.src{cursor:pointer}
.srcsplit button.src:hover{border-color:var(--line-2)}
.srcsplit .src>svg{flex:none;color:var(--muted)}
.srcsplit .src>span:not(.money){display:grid;flex:1;min-width:0;font-size:12.5px;line-height:1.3}
.srcsplit .src small{color:var(--muted);font-size:11.5px}
.srcsplit .src .money{font-size:15px;font-weight:700;color:var(--fg);white-space:nowrap;flex:none}
.srcsplit button.src>svg{color:#1a8f4c}
.wa-t{display:inline-flex;align-items:center;gap:3px;color:#1a8f4c;font-weight:600}
.wak{margin-bottom:14px}

/* ===== customer reviews */
.stars{display:inline-flex;gap:2px;color:var(--line-2);vertical-align:middle}
.stars i{display:inline-flex;width:16px;height:16px}
.stars svg{width:100%;height:100%}
.stars i.on{color:#f5a524}
.revsum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:12px}
.rs-avg{display:grid;justify-items:center;gap:5px;padding-inline-end:18px;border-inline-end:1px solid var(--line)}
.rs-avg b{font:800 40px/1 var(--f-display)}
.rs-avg small{color:var(--muted);font-size:12.5px}
.rs-bars{display:grid;gap:6px;min-width:0}
.rs-bars div{display:grid;grid-template-columns:12px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.rs-bars i{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden;display:block}
.rs-bars i b{display:block;height:100%;background:#f5a524;border-radius:9px}
.rev-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rev .stars i{width:17px;height:17px}
.rev blockquote{white-space:pre-line}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--good);background:var(--good-bg);padding:3px 8px;border-radius:99px}
.vbadge.wa{color:#1a8f4c;background:rgba(37,211,102,.12)}
.rev-shot{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%;text-align:inherit}
.shot{display:block}
.shot img{display:block;width:100%;max-height:280px;object-fit:cover;object-position:top;border-radius:14px;border:1px solid var(--line)}

.rrow .amt .stars i{width:14px;height:14px}
.rev-full{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}

.kpi .stars{margin-top:2px}

.sublist{display:grid;gap:8px}
.subrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.subrow.due{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn-bg) 55%,var(--surface))}

.sub-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;background:none;border:0;color:inherit;font:inherit;text-align:start;cursor:pointer;min-width:0}
.sub-t{display:grid;gap:1px;min-width:0}
.sub-t b{font:700 14.5px/1.35 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-t>span{font-size:13px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-t small{font-size:12px;color:var(--muted)}

/* ================================================================
   Design system v3 · components
   One loud thing: the ribbon gradient from the logo (primary actions + hero mark).
   Everything else stays quiet: thin borders, tinted shadows only on lift.
   ================================================================ */
body{font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--brand) 26%,transparent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* buttons */
.btn{border-radius:13px;font-family:var(--f-display);font-weight:600;letter-spacing:-.1px;transition:background .18s,border-color .18s,color .18s,box-shadow .18s,transform .12s}

.btn.primary:hover{background:var(--ribbon);background-size:160% 100%;background-position:100% 0;border-color:transparent;box-shadow:0 14px 28px -12px rgba(31,85,232,.85),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.light{background:#fff;color:#0a1640;border-color:#fff;box-shadow:0 12px 26px -14px rgba(0,0,0,.55)}

/* inputs */
.inp{border-radius:13px;transition:border-color .15s,box-shadow .15s,background .15s}
.inp:focus{border-color:var(--brand);box-shadow:var(--ring)}
.search{border-radius:15px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--brand);box-shadow:var(--ring)}
.fchip{font-family:var(--f-display);font-weight:500;transition:background .15s,border-color .15s,color .15s}
.fchip:hover{border-color:var(--brand);color:var(--fg)}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* header */
.hdr{background:var(--glass)}

.mainnav a{font-family:var(--f-display);font-weight:500;font-size:14.5px}
.mainnav a:hover{background:var(--brand-soft);color:var(--brand)}
.hbtn{border-radius:13px;transition:border-color .15s,color .15s,background .15s}

.thbtn .i-moon{display:none}

:root[data-theme="dark"] .thbtn .i-sun{display:block}:root[data-theme="dark"] .thbtn .i-moon{display:none}
:root[data-theme="light"] .thbtn .i-sun{display:none}:root[data-theme="light"] .thbtn .i-moon{display:block}
.throw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;font-weight:600}

/* hero */

.awning{background:
  radial-gradient(circle at 11px 0,#1f55e8 0 10.5px,transparent 11px) 0 11px/44px 11px repeat-x,
  radial-gradient(circle at 33px 0,#38c2f7 0 10.5px,transparent 11px) 0 11px/44px 11px repeat-x,
  repeating-linear-gradient(90deg,#1f55e8 0 22px,#38c2f7 22px 44px) 0 0/100% 11px no-repeat}
.announce{background:var(--ribbon)}

.trust b{font:600 14.5px/1.4 var(--f-display)}

.catcard{border-radius:18px;transition:border-color .18s,box-shadow .18s,transform .18s}

/* product cards */
.pcard{border-radius:20px;padding:16px;gap:7px;transition:border-color .2s,box-shadow .2s,transform .2s}

.seo{border-radius:24px}
.cta{border-radius:28px}
.cta::before{background:radial-gradient(560px 280px at 90% 0%,rgba(31,110,255,.62),transparent 70%),radial-gradient(360px 200px at 0% 100%,rgba(56,194,247,.25),transparent 70%)}
.cta h2{font-weight:700}
.foot h3{font:600 15px/1.3 var(--f-display)}

/* sheets */
.sheet{border-radius:26px 26px 0 0;box-shadow:0 -20px 60px -30px rgba(0,0,0,.5)}
@media (min-width:720px){.sheet{border-radius:26px}}
.sh-head h2{font:600 17.5px/1.3 var(--f-display)}
.plan[aria-checked="true"],.method[aria-pressed="true"]{border-color:var(--brand);box-shadow:var(--ring)}
.done h3,.pd-head h3{font-weight:700}

/* admin */
.a-h h1{font:700 26px/1.25 var(--f-display);letter-spacing:-.5px}
.card,.kpi{border-radius:22px}
.kpi .lbl{font:600 14px/1.3 var(--f-display)}
.kpi .val{font:700 28px/1.1 var(--f-display);letter-spacing:-.6px}
.kpi.big{background:var(--navy);color:var(--on-navy);border-color:transparent;position:relative;overflow:hidden;isolation:isolate}
.kpi.big::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(420px 220px at 100% 0,rgba(31,110,255,.6),transparent 70%),radial-gradient(300px 180px at 0 100%,rgba(56,194,247,.22),transparent 70%)}

/* ---------------------------------------------------------------- scroll reveal
   Each block rises 16px and fades in once, the first time it enters the screen.
   Items that enter together are staggered by 60ms in reading order. */
.rv{opacity:0;transform:translate3d(0,44px,0) scale(.97);transition:opacity .8s cubic-bezier(.2,.7,.2,1) var(--rv-d,0ms),transform 1s cubic-bezier(.16,1,.3,1) var(--rv-d,0ms)}
.rv.rv-pop{transform:translate3d(0,30px,0) scale(.86)}
.rv.rv-side{transform:translate3d(0,38px,0) scale(.92) rotate(-1.5deg);transform-origin:100% 0}
.rv.rv-fade{transform:none}
.rv.in{opacity:1;transform:none}

/* ================= helpers ================= */
function $(s,r){return (r||D).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||D).querySelectorAll(s))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function latin(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776})}
function num(v){var n=parseFloat(latin(v).replace(/[^\d.\-]/g,''));return isFinite(n)?n:0}
function numOrNull(v){return String(v==null?'':v).trim()===''?null:num(v)}
function fmt(n){n=Math.round((+n||0)*100)/100;return n.toLocaleString('en-US',{maximumFractionDigits:2})}
function cur(){return (S.settings&&S.settings.currency)||'₪'}
function money(n,cls){return '<span class="money'+(cls?' '+cls:'')+'"><b>'+fmt(n)+'</b><i>'+esc(cur())+'</i></span>'}
function strike(n){return '<s class="strike" dir="ltr">'+fmt(n)+esc(cur())+'</s>'}
function pctTxt(n){return (Math.round(n*10)/10).toLocaleString('en-US',{maximumFractionDigits:1})+'%'}
function pct(n){return '<span class="num" dir="ltr">'+pctTxt(n)+'</span>'}
function clone(o){return JSON.parse(JSON.stringify(o))}
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function addDays(t,n){var d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()}
function weekStart(t){var d=new Date(dayStart(t));d.setDate(d.getDate()-((d.getDay()-WEEK_START+7)%7));return d.getTime()}
function monthStart(t){var d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),1).getTime()}
function addMonths(t,n){var d=new Date(t);return new Date(d.getFullYear(),d.getMonth()+n,1).getTime()}
function fdate(t,o){try{return new Intl.DateTimeFormat('ar-u-nu-latn',o).format(new Date(t))}catch(e){return new Date(t).toLocaleDateString()}}
function dayLabel(t){var s=dayStart(t),today=dayStart(Date.now());if(s===today)return 'اليوم';if(s===addDays(today,-1))return 'أمس';return fdate(t,{weekday:'long',day:'numeric',month:'long'})}
function ftime(t){return fdate(t,{hour:'numeric',minute:'2-digit'})}
function isoDay(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function intlDigits(p){var s=latin(p||'').trim();if(s.charAt(0)==='+')return s.slice(1).replace(/\D/g,'');var d=s.replace(/\D/g,'');if(d.indexOf('00')===0)return d.slice(2);if(/^05[69]/.test(d))return '970'+d.slice(1);if(/^05/.test(d))return '972'+d.slice(1);return d}
function waDigits(){return intlDigits((S.settings&&S.settings.whatsapp)||'')}
function waPretty(){var d=waDigits();if(d.length===12&&/^97[02]/.test(d))return '+'+d.slice(0,3)+' '+d.slice(3,5)+' '+d.slice(5,8)+' '+d.slice(8);return '+'+d}
function waLink(text,to){return 'https://wa.me/'+(to||waDigits())+(text?'?text='+encodeURIComponent(text):'')}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return v===undefined?null:false}}
function newOrderNo(){return 'HZ-'+(10000+Math.floor(Math.random()*90000))}
function smooth(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}catch(e){return 'auto'}}

  if(!('IntersectionObserver' in window))return;var soft=rvNoMotion();
  if(!rvIO)rvIO=new IntersectionObserver(function(es){var vis=es.filter(function(e){return e.isIntersecting});
    vis.sort(function(a,b){return a.target.compareDocumentPosition(b.target)&4?-1:1});
    vis.forEach(function(e,i){var el=e.target;rvIO.unobserve(el);el.style.setProperty('--rv-d',Math.min(i,8)*90+'ms');el.classList.add('in');rvSeen[el.dataset.rvk]=1;
      setTimeout(function(){el.classList.remove('rv','in','rv-pop','rv-side','rv-fade','rv-soft');el.style.removeProperty('--rv-d')},2000+Math.min(i,8)*90)})},{rootMargin:'0px 0px -8% 0px',threshold:.1});
  var pre=rvPrefix();
  RV.forEach(function(r,si){var list=root.querySelectorAll(r[0]);for(var i=0;i<list.length;i++){var el=list[i];if(el.dataset.rvk||el.closest('.ov'))continue;
    var k=pre+':'+si+':'+(r[0]==='.pcard'?S.cat+':'+S.sort+':':'')+i;el.dataset.rvk=k;if(rvSeen[k])continue;
    el.classList.add('rv');if(r[1])el.classList.add(r[1]);if(soft)el.classList.add('rv-soft');rvIO.observe(el)}});
}
function rvStart(){var root=D.getElementById('root');if(!root||rvMO||!('MutationObserver' in window))return;
  rvMO=new MutationObserver(function(){if(rvBusy)return;rvBusy=true;try{rvScan()}finally{rvBusy=false}});
  rvMO.observe(root,{childList:true,subtree:true});rvScan();
  var t=0;window.addEventListener('scroll',function(){if(t)return;t=requestAnimationFrame(function(){t=0;$$('.rv:not(.in)').forEach(function(el){if(el.getBoundingClientRect().bottom<0){if(rvIO)rvIO.unobserve(el);el.classList.add('in');rvSeen[el.dataset.rvk]=1;setTimeout(function(){el.classList.remove('rv','in','rv-pop','rv-side','rv-fade','rv-soft')},1200)}})})},{passive:true})}

function filtered(){
  var list=visibleProducts(),q=S.q.trim().toLowerCase();
  if(S.cat!=='all')list=list.filter(function(p){return p.cat===S.cat});
  if(q)list=list.filter(function(p){return (p.name+' '+(p.keywords||'')+' '+(p.note||'')+' '+(p.desc||'')+' '+catName(p.cat)+' '+p.plans.map(function(x){return x.name}).join(' ')).toLowerCase().indexOf(q)>-1});
  var base=function(p){return p.plans[0]?p.plans[0].price:0};
  list=list.slice();
  if(S.sort==='low')list.sort(function(a,b){return base(a)-base(b)});
  else if(S.sort==='high')list.sort(function(a,b){return base(b)-base(a)});
  else list.sort(function(a,b){return catIndex(a.cat)-catIndex(b.cat)||(a.sort||0)-(b.sort||0)});
  return list;
}
function chipsHTML(){var vis=visibleProducts();var list=[{id:'all',name:'الكل',n:vis.length}].concat(cats().map(function(c){return {id:c.id,name:c.name,n:vis.filter(function(p){return p.cat===c.id}).length}}).filter(function(c){return c.n}));
  return list.map(function(c){return '<button class="fchip" data-act="cat" data-id="'+esc(c.id)+'" aria-pressed="'+(S.cat===c.id)+'">'+esc(c.name)+'<span class="n">'+c.n+'</span></button>'}).join('')}

function logsOrders(){return S.settings.siteOrders!==false}
function orderText(){
  var o=S.co,m=curMethod(),st=S.settings,lines=coLines();
  var L=['مرحباً '+st.storeName+'، طلب جديد رقم '+o.no+':'];
  lines.forEach(function(x){L.push('- '+x.p.name+' ('+x.plan.name+')'+(x.qty>1?' ×'+x.qty:'')+': '+fmt(x.plan.price*x.qty)+' '+cur())});
  L.push('المجموع: '+fmt(coTotal())+' '+cur());
  if(m)L.push('طريقة الدفع: '+m.name);
  if(m&&o.proof.trim())L.push((m.proofLabel||'تفاصيل الحوالة')+': '+o.proof.trim());
  if(o.img)L.push(CLOUD&&logsOrders()?'رفعت سكرين الحوالة مع الطلب على الموقع.':'رح أبعت سكرين الحوالة هون بالمحادثة.');
  if(o.name.trim())L.push('الاسم: '+o.name.trim());
  if(o.phone.trim())L.push('رقم التواصل: '+o.phone.trim());
  if(o.email.trim())L.push('إيميل التفعيل: '+o.email.trim());
  return L.join('\n');

function updateSendHref(){var a=$('#co-send');if(a&&S.co)a.href=waLink(orderText())}
function validateOrder(){var o=S.co,m=curMethod(),e=[],pr=o.proof.trim();
  if(!m)e.push('اختار طريقة الدفع.');
  if(!pr&&!o.img)e.push('اكتب '+((m&&m.proofLabel)||'تفاصيل الحوالة')+' أو ارفع سكرين الحوالة.');
  else if(pr&&m&&m.proofType==='tel'&&!o.img&&latin(pr).replace(/\D/g,'').length<9)e.push('رقم الجوال لازم يكون 10 أرقام، مثل 0599123456.');
  if(o.name.trim().length<2)e.push('اكتب اسمك.');
  if(o.phone.trim()&&latin(o.phone).replace(/\D/g,'').length<9)e.push('رقم واتساب مش مكتوب صح.');
  if(o.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email.trim()))e.push('الإيميل مش مكتوب صح.');
  return e}
function sendOrder(el,ev){
  var o=S.co;if(!o){ev.preventDefault();return}var errs=validateOrder(),box=$('#co-err');
  if(errs.length){ev.preventDefault();box.innerHTML=errs.map(esc).join('<br>');box.hidden=false;box.scrollIntoView({behavior:smooth(),block:'center'});return}
  box.hidden=true;updateSendHref();
  var m=curMethod(),href=el.href,lines=coLines();
  store('hazem-me',{name:o.name.trim(),phone:o.phone.trim()});
  if(logsOrders()){
    var rec={orderNo:o.no,items:lines.map(function(x){return {productId:x.p.id,productName:String(x.p.name).slice(0,100),planId:x.plan.id,planName:String(x.plan.name).slice(0,60),price:+x.plan.price||0,qty:x.qty}}),total:coTotal(),customer:o.name.trim().slice(0,60),phone:o.phone.trim().slice(0,20),email:o.email.trim().slice(0,100),payment:m?String(m.name).slice(0,60):'',proofText:o.proof.trim().slice(0,120),proofImage:o.img||'',status:'pending',source:'site'};
    if(CLOUD&&S.user&&S.user.uid)rec.uid=S.user.uid;
    DB.createSiteOrder(rec).catch(function(e){console.warn('order log failed',e)});
  }
  if(o.fromCart){CART=[];saveCart()}
  var sh=S.cosheet,no=o.no,sendImg=o.img&&!(CLOUD&&logsOrders());
  setTimeout(function(){if(!sh||sh.closed)return;S.co=null;sh.set('<div class="done"><div class="done-ic">'+svg('check',32)+'</div><h3>انسجل طلبك</h3><p>رقم طلبك <b dir="ltr">'+esc(no)+'</b>. كمّل الإرسال على واتساب'+(sendImg?' وابعت سكرين الحوالة بالمحادثة':'')+'، وبنفعّلك الاشتراك أول ما نتأكد من الحوالة.</p><a class="btn wa block lg" href="'+esc(href)+'" target="_blank" rel="noopener">'+svg('chat')+' افتح واتساب مرة ثانية</a><p class="fine">إذا ما انفتح واتساب، راسلنا على <span class="sel" dir="ltr">'+esc(waPretty())+'</span></p><button class="btn block" data-close>تمام</button></div>','تم إرسال الطلب')},60);
}

function authMsg(e){var c=e&&e.code||'';
  if(/popup-closed|cancelled-popup/.test(c))return '';
  if(/email-already-in-use/.test(c))return 'هالإيميل إله حساب، سجّل دخول بدل ما تعمل حساب جديد.';
  if(/weak-password/.test(c))return 'كلمة السر لازم تكون 6 أحرف أو أكثر.';
  if(/invalid-email|missing-email/.test(c))return 'الإيميل مش مكتوب صح.';
  if(/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c))return 'الإيميل أو كلمة السر غلط.';
  if(/too-many/.test(c))return 'محاولات كثيرة، استنى شوي وجرّب.';
  if(/operation-not-allowed|admin-restricted/.test(c))return 'إنشاء الحسابات بهالطريقة مش مفعّل حالياً. تواصل معنا على واتساب.';
  if(/popup-blocked|operation-not-supported|web-storage/.test(c))return 'المتصفح منع نافذة جوجل. افتح الموقع بـ Chrome أو Safari، أو ادخل بالإيميل.';
  if(/unauthorized-domain/.test(c))return 'الدخول بجوجل مش مفعّل لهالموقع لسا.';
  if(/network/.test(c))return 'في مشكلة بالإنترنت، تأكد من الاتصال.';
  return 'ما قدرنا ندخل، جرّب مرة ثانية.'}

/* ----- top-up ----- */
function minTopup(){return Math.max(1,+S.settings.minTopup||10)}
function openTopup(amount){
  if(!S.user){openAccount();return}
  var ms=activeMethods();if(!ms.length){toast('طرق الدفع مش متاحة حالياً، راسلنا على واتساب');return}
  S.tp={amount:amount?String(Math.max(+amount,minTopup())):'',method:ms[0].id,proof:'',img:'',no:'TP-'+(10000+Math.floor(Math.random()*90000))};
  S.tpsheet=openSheet({title:'شحن الرصيد',body:topupHTML(),onClose:function(){S.tp=null}});
  updateTopupHref();
}
function tpMethod(){var t=S.tp,ms=activeMethods();return ms.find(function(m){return m.id===t.method})||ms[0]}
function topupHTML(){
  var t=S.tp,m=tpMethod(),amt=num(t.amount);
  var h='<div class="ostep"><h3><span class="sn">١</span>المبلغ وطريقة الدفع</h3><label class="field"><span>كم بدك تشحن؟ <em>(أقل شي '+fmt(minTopup())+esc(cur())+')</em></span><input class="inp ltr" id="tp-amount" inputmode="decimal" value="'+esc(t.amount)+'" placeholder="50"></label>'+
   '<div class="chips">'+[20,50,100,200].filter(function(v){return v>=minTopup()}).map(function(v){return '<button class="fchip" data-act="tpAmt" data-v="'+v+'" aria-pressed="'+(amt===v)+'">'+v+esc(cur())+'</button>'}).join('')+'</div>'+
   '<div class="methods">'+activeMethods().map(function(x){return '<button class="method" data-act="tpMethod" data-id="'+esc(x.id)+'" aria-pressed="'+(x.id===m.id)+'">'+tile(x,'sm','card')+'<span>'+esc(x.name)+'</span></button>'}).join('')+'</div></div>';
  h+='<div class="ostep" id="tp-pay">'+payDetailsHTML(m,amt||0)+'</div>';
  h+='<div class="ostep" id="tp-proof">'+proofHTML(m,t,'tp')+'</div>';
  h+='<p class="err" id="tp-err" hidden></p><a class="btn wa block lg" id="tp-send" href="#" target="_blank" rel="noopener" data-act="sendTopup">'+svg('chat',18)+' أرسل طلب الشحن</a><p class="fine">بعد ما نتأكد من الحوالة بينضاف المبلغ لرصيدك، وبتشوف الحالة بحسابك.</p>';
  return h;
}
function rerenderTopup(){if(S.tpsheet&&!S.tpsheet.closed){S.tpsheet.set(topupHTML(),null,true);updateTopupHref()}}
function topupText(){var t=S.tp,m=tpMethod(),w=S.wallet||{};var L=['مرحباً '+S.settings.storeName+'، طلب شحن رصيد رقم '+t.no+':','المبلغ: '+fmt(num(t.amount))+' '+cur(),'طريقة الدفع: '+m.name];
  if(t.proof.trim())L.push((m.proofLabel||'تفاصيل الحوالة')+': '+t.proof.trim());
  if(t.img)L.push('رفعت سكرين الحوالة على الموقع.');
  L.push('الحساب: '+(S.user&&S.user.email||''));if(w.name)L.push('الاسم: '+w.name);return L.join('\n')}
function updateTopupHref(){var a=$('#tp-send');if(a&&S.tp)a.href=waLink(topupText())}
function sendTopup(el,ev){
  var t=S.tp;if(!t||!S.user){ev.preventDefault();return}
  var m=tpMethod(),amt=num(t.amount),e=[],pr=t.proof.trim(),box=$('#tp-err');
  if(!(amt>=minTopup()))e.push('أقل مبلغ للشحن '+fmt(minTopup())+' '+cur()+'.');
  if(amt>5000)e.push('أعلى مبلغ للشحن بالمرة 5000 '+cur()+'.');
  if(!pr&&!t.img)e.push('اكتب '+(m.proofLabel||'تفاصيل الحوالة')+' أو ارفع سكرين الحوالة.');
  else if(pr&&m.proofType==='tel'&&!t.img&&latin(pr).replace(/\D/g,'').length<9)e.push('رقم الجوال لازم يكون 10 أرقام، مثل 0599123456.');
  if(e.length){ev.preventDefault();box.innerHTML=e.map(esc).join('<br>');box.hidden=false;return}
  box.hidden=true;updateTopupHref();var href=el.href,w=S.wallet||{};
  DB.createTopup({uid:S.user.uid,name:String(w.name||S.user.name||'').slice(0,60),email:String(S.user.email||'').slice(0,100),phone:String(w.phone||'').slice(0,20),amount:amt,payment:String(m.name).slice(0,60),proofText:pr.slice(0,120),proofImage:t.img||'',status:'pending'}).catch(function(err){console.warn(err);toast('ما قدرنا نسجّل طلب الشحن بالموقع، بس رسالتك على واتساب بتوصل')});
  var sh=S.tpsheet;setTimeout(function(){if(!sh||sh.closed)return;S.tp=null;sh.set('<div class="done"><div class="done-ic">'+svg('check',32)+'</div><h3>انبعت طلب الشحن</h3><p>أول ما نتأكد من الحوالة بينضاف '+money(amt)+' لرصيدك، وبتشوف الحالة بحسابك.</p><a class="btn wa block lg" href="'+esc(href)+'" target="_blank" rel="noopener">'+svg('chat')+' افتح واتساب مرة ثانية</a><button class="btn block" data-act="account" data-tab="topups" data-close>عرض عمليات الشحن</button></div>','تم إرسال الطلب')},60);
}
/* ----- pay from balance ----- */
function walletPay(el){
  if(!S.user){openAccount();return}
  var o=S.co,lines=coLines(),total=coTotal(),bal=S.wallet?(+S.wallet.balance||0):0,box=$('#co-err');
  if(bal<total){box.textContent='رصيدك ما بكفي.';box.hidden=false;return}
  if(o.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email.trim())){box.textContent='الإيميل مش مكتوب صح.';box.hidden=false;return}
  box.hidden=true;o.paying=true;el.disabled=true;el.innerHTML='جاري الدفع…';
  var units=[];lines.forEach(function(x){for(var i=0;i<x.qty;i++)units.push(x)});
  var res=[],stop=false;
  units.reduce(function(p,x){return p.then(function(){if(stop)return;return buyUnit(x,o).then(function(r){res.push({x:x,r:r})},function(e){console.warn('walletBuy',e);stop=true;res.push({x:x,e:e})})})},Promise.resolve()).then(function(){
    if(o.fromCart){var got={};res.forEach(function(z){if(z.r){var k=z.x.p.id+'|'+z.x.plan.id;got[k]=(got[k]||0)+1}});CART.forEach(function(c){var k=c.pid+'|'+c.plan;if(got[k])c.qty=Math.max(0,(c.qty||1)-got[k])});CART=CART.filter(function(c){return c.qty>0});saveCart()}
    store('hazem-me',{name:o.name,phone:o.phone});
    walletDone(res);
  });
}
function buyUnit(x,o){
  var it={productId:x.p.id,productName:String(x.p.name).slice(0,100),planId:x.plan.id,planName:String(x.plan.name).slice(0,60),price:+x.plan.price,qty:1,planIndex:x.p.plans.indexOf(x.plan)};
  var w=S.wallet||{},uid=S.user.uid,meta={orderNo:newOrderNo(),customer:String(w.name||S.user.name||'').slice(0,60),phone:String(o.phone||w.phone||'').trim().slice(0,20),email:String(o.email||'').trim().slice(0,100)};
  if(!x.plan.instant)return DB.walletBuy(uid,it,meta,null);
  return DB.findStock(x.p.id,x.plan.id).catch(function(){return []}).then(function(ids){
    ids=ids.sort(function(){return Math.random()-.5}).slice(0,3);
    function tryAt(i){if(i>=ids.length)return DB.walletBuy(uid,it,meta,null);
      return DB.walletBuy(uid,it,meta,ids[i]).catch(function(e){var c=e&&e.code||'';if(c==='stock/taken'||/permission/.test(c))return tryAt(i+1);throw e})}
    return tryAt(0);
  });
}
function walletDone(res){
  var ok=res.filter(function(z){return z.r}),bad=res.filter(function(z){return z.e}),pend=ok.filter(function(z){return !z.r.stock});
  var h='<div class="done"><div class="done-ic"'+(ok.length?'':' style="background:var(--bad-bg);color:var(--bad)"')+'>'+svg(ok.length?'check':'alert',32)+'</div><h3>'+(ok.length?'تم الدفع من رصيدك':'ما تم الدفع')+'</h3></div>';
  if(ok.length)h+='<div class="list-plain">'+ok.map(function(z){return '<div class="mrow"><div class="mrow-h"><b><bdi>'+esc(z.x.p.name)+'</bdi> <span class="muted" style="font-weight:500">'+esc(z.x.plan.name)+'</span></b><span class="pill '+(z.r.stock?'done':'paid')+'">'+(z.r.stock?'تم التسليم':'قيد التسليم')+'</span></div>'+(z.r.stock?codeHTML(z.r.stock):'<p class="hint">رح نسلّمك هالاشتراك على واتساب بأقرب وقت.</p>')+'</div>'}).join('')+'</div>';
  if(bad.length){var c=bad[0].e&&bad[0].e.code||'';h+='<p class="err">'+(c==='wallet/insufficient'?'رصيدك ما كفى لكل الطلبات، فما انخصم ثمن الباقي.':'ما قدرنا نكمل الدفع'+(ok.length?' لكل الطلبات':'')+'، وما انخصم ثمن اللي ما اندفع. حدّث الصفحة وجرّب مرة ثانية، وإذا تكررت تواصل معنا.')+'</p>'}
  if(pend.length)h+='<a class="btn wa block lg" href="'+esc(waLink('مرحباً '+S.settings.storeName+'، دفعت من رصيدي: '+pend.map(function(z){return z.r.orderNo+' ('+z.x.p.name+' - '+z.x.plan.name+')'}).join('، ')))+'" target="_blank" rel="noopener">'+svg('chat',18)+' بلّغنا على واتساب</a>';
  h+='<button class="btn block" data-act="account" data-tab="orders" data-close>عرض طلباتي</button><button class="btn block" data-close>تمام</button>';
  var sh=S.cosheet;S.co=null;if(sh&&!sh.closed)sh.set(h,ok.length?'تم الدفع':'ما تم الدفع');
  ok.forEach(function(z){if(z.r.stock)loadCode(z.r.stock)});
}

function saveProduct(el){
  var p=S.pf,isNew=el.dataset.new==='1';var name=$('#pf-name').value.trim();if(!name){toast('اكتب اسم الاشتراك');$('#pf-name').focus();return}
  var pls=readPlans().filter(function(x){return x.name||x.price});if(!pls.length||pls.some(function(x){return x.price<=0})){toast('اكتب سعر البيع لكل مدة');return}
  p.name=name;p.cat=$('#pf-cat').value;p.note=$('#pf-note').value.trim();p.badge=$('#pf-badge').value.trim();p.desc=$('#pf-desc').value.trim();p.keywords=$('#pf-kw').value.trim();p.domain=cleanDomain($('#pf-domain').value);
  p.features=$('#pf-feat').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);p.sort=num($('#pf-sort').value)||0;p.active=$('#pf-active').checked;
  if(isNew){var base=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24);p.id=(base||'p')+'-'+uid().slice(0,4)}
  var cm={};pls.forEach(function(x){if(x.cost!=null)cm[x.id]=x.cost});S.costs[p.id]=cm;
  p.plans=pls.map(function(x){return {id:x.id,name:x.name,price:x.price,compare:x.compare>x.price?x.compare:0,instant:!!x.instant,dur:x.dur&&x.dur!=='auto'?x.dur:''}});
  var i=S.products.findIndex(function(x){return x.id===p.id});if(i<0)S.products.push(clone(p));else S.products[i]=clone(p);
  S.products.sort(function(a,b){return (a.sort||0)-(b.sort||0)});
  el.disabled=true;

}

function exportJSON(){return JSON.stringify({app:'hazem-store',version:2,exportedAt:new Date().toISOString(),settings:S.settings,products:S.products,costs:S.costs},null,1)}

  rmProof:function(el){var pre=el.dataset.pre||'co',st=pre==='tp'?S.tp:S.co;if(!st)return;st.img='';$('#'+pre+'-upl').innerHTML=uplHTML(st,pre);if(pre==='tp')updateTopupHref();else updateSendHref()},

  custLogout:function(){DB.logout().then(function(){toast('طلعت من حسابك')})},

  topupOpen:function(el){openTopup(el.dataset.amount)},

  ctab:function(el){S.ctab=el.dataset.id;renderAdminBody()},

  openCust:function(el){openCust(el.dataset.id)},

  showCode:function(el){DB.readCode(el.dataset.id).then(function(v){openSheet({title:'الكود المسلّم',body:'<pre class="codev" dir="ltr">'+esc(v||'—')+'</pre><button class="copy" data-act="copy" data-text="'+esc(v||'')+'">'+svg('copy',15)+'<span>نسخ</span></button>'})}).catch(fail)},
  stockOpen:function(el){openStock(S.pf&&S.pf.id,el.dataset.plan)},

  copy:function(el){copyText(el.dataset.text,el)},
  resetPass:function(){var e=$('#l-email');if(!e||!e.value.trim()){toast('اكتب إيميلك أول');if(e)e.focus();return}DB.reset(e.value).then(function(){toast('بعتنالك رابط تغيير كلمة السر على الإيميل')}).catch(fail)},

    ab.disabled=true;if(S.authMode==='signup')S.pendingName=nm;(S.authMode==='signup'?DB.signup(nm,em,pw):DB.login(em,pw)).catch(function(x){ab.disabled=false;authErr(x)});return}
  if(e.target.id!=='login-f')return;e.preventDefault();var btn=e.target.querySelector('[type=submit]');
  var em=$('#l-email'),pw=$('#l-pass'),err=$('#l-err');err.hidden=true;
  function bad(m,f){err.textContent=m;err.hidden=false;if(f)f.focus()}
  if(!em.value.trim())return bad('اكتب إيميل الإدارة.',em);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim()))return bad('الإيميل مش مكتوب صح.',em);
  if(!pw.value)return bad('اكتب كلمة السر.',pw);
  if(!CLOUD)return bad(B.page==='admin'?'ما في اتصال بقاعدة البيانات، حدّث الصفحة وجرّب كمان مرة.':'الدخول للوحة متاح بس على موقعك الرسمي.');
  btn.disabled=true;
  Promise.resolve().then(function(){return DB.login(em.value,pw.value)}).catch(function(x){btn.disabled=false;var c=x&&x.code||'';bad(/wrong|invalid|not-found/.test(c)?'الإيميل أو كلمة السر غلط.':/too-many/.test(c)?'محاولات كثيرة، استنى شوي وجرّب.':'ما قدرنا ندخل، تأكد من الإنترنت.')})});

/* ================= auth & boot ================= */
function stopWatch(arr){(arr||[]).forEach(function(f){try{if(typeof f==='function')f()}catch(e){}});return []}
function adminRefresh(){if(S.view==='admin'&&$('#abody'))renderAdminBody()}
function startAdminData(){
  if(S.adminOn||!S.user||!S.isAdmin)return;S.adminOn=true;
  DB.seedIfEmpty().then(function(seeded){if(seeded){toast('تجهّز المتجر بالبيانات الأساسية');return DB.loadPublic().then(function(pub){applyPublic(pub);cachePublic()})}}).catch(function(e){console.warn(e)}).then(function(){
    return DB.loadPrivate().then(function(p){S.costs=p.costs||{};adminRefresh()})}).catch(fail);
  S.aw.push(DB.watchOrders(function(list){S.orders=list;adminRefresh()}));
  S.aw.push(DB.watchReviewsA(function(l){S.reviewsA=l;adminRefresh()}));
  if(CLOUD){
    S.aw.push(DB.watchTopups(function(l){S.topups=l;adminRefresh()}));
    S.aw.push(DB.watchWallets(function(l){S.wallets=l;adminRefresh()}));
    S.aw.push(DB.watchStock(function(l){S.stock=l;adminRefresh();refreshStock()}));
  }
}
function onUser(u){
  S.authKnown=true;S.uw=stopWatch(S.uw);S.aw=stopWatch(S.aw);S.adminOn=false;
  S.user=u;S.wallet=null;S.myOrders=[];S.myTopups=[];S.myReviews=[];
  S.isAdmin=!!u&&CLOUD&&!!CFG.adminEmail&&String(u.email||'').toLowerCase()===String(CFG.adminEmail).toLowerCase();
  if(!u||!S.isAdmin){S.orders=[];S.costs={};S.topups=[];S.wallets=[];S.stock=[];S.reviewsA=[]}
  if(u&&walletOn()&&B.page!=='admin'){
    DB.ensureWallet(u).catch(function(e){console.warn('ensureWallet',e)});
    S.uw.push(DB.watchWallet(u.uid,function(w){S.wallet=w;refreshHeader();refreshAccount();refreshCheckout()}));
    S.uw.push(DB.watchMyOrders(u.uid,function(l){S.myOrders=l;refreshAccount()}));
    S.uw.push(DB.watchMyTopups(u.uid,function(l){S.myTopups=l;refreshAccount()}));
    S.uw.push(DB.watchMyReviews(u.uid,function(l){S.myReviews=l;refreshAccount()}));
  }
  if(S.view==='admin')render();
  else{refreshHeader();refreshAccount(true);refreshCheckout()}
}
function boot(){
  S.view=wantView();
  var cached=CLOUD?store('hazem-cache-v2'):null;
  if(cached&&cached.settings){applyPublic(cached);S.loaded=true}
  render();themeMeta();rvStart();
  DB.init().then(function(){
    S.dbReady=true;
    return DB.loadPublic().then(function(pub){applyPublic(pub);cachePublic()},function(e){console.error(e);if(!cached)S.loadError=true});
  }).catch(function(e){console.error(e);S.loadError=true}).then(function(){
    S.loaded=true;render();if(S.view==='store')handleStoreHash();
    if(B.page!=='admin')loadReviews();
    try{DB.onAuth(onUser)}catch(e){console.error(e);S.authKnown=true;render()}
  });
}
boot();
})();
