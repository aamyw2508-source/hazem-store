name: audit products (read-only)
# Reads the public product list and store settings (the same data the store page shows) and prints a summary.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: read public products
        run: |
          python3 - <<'PY'
          import json, urllib.request
          B='https://firestore.googleapis.com/v1/projects/hazem-store-7a272/databases/(default)/documents/'
          def val(v):
              k=next(iter(v));x=v[k]
              if k=='mapValue': return {a:val(b) for a,b in x.get('fields',{}).items()}
              if k=='arrayValue': return [val(i) for i in x.get('values',[])]
              if k in('integerValue',): return int(x)
              return x
          def get(path):
              return json.load(urllib.request.urlopen(B+path))
          docs=[];tok=''
          while True:
              r=get('products?pageSize=300'+('&pageToken='+tok if tok else ''))
              docs+=r.get('documents',[]);tok=r.get('nextPageToken')
              if not tok: break
          out=[]
          for d in docs:
              f={a:val(b) for a,b in d.get('fields',{}).items()}
              img=f.pop('img','')
              f['img']='yes' if img else ''
              f['desc_len']=len(f.pop('desc','') or '')
              f['id']=d['name'].rsplit('/',1)[1]
              out.append(f)
          s=get('settings/main');sf={a:val(b) for a,b in s.get('fields',{}).items()}
          import gzip, base64
          blob=base64.b64encode(gzip.compress(json.dumps({'cats':sf.get('categories',[]),'products':out},ensure_ascii=False).encode())).decode()
          parts=[blob[i:i+3900] for i in range(0,len(blob),3900)]
          print('NPRODUCTS=%d parts=%d'%(len(out),len(parts)))
          for i,c in enumerate(parts): print('::notice title=part %d of %d::%s'%(i+1,len(parts),c))
          PY
