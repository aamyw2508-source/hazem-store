# Copies Firebase's sign-in helper pages onto hazem-store.com, so "Sign in with Google" stays on the
# store's own domain. Safari on iPhone (and in-app browsers) block the old firebaseapp.com flow.
name: Firebase sign-in helper
on:
  push:
    branches: [main]
    paths: ['.github/workflows/auth-helper.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # refresh weekly
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the helper files
        run: |
          P=https://hazem-store-7a272.firebaseapp.com
          mkdir -p __/auth __/firebase
          : > __/auth/fetch-log.txt
          get() { code=$(curl -sSL -A "Mozilla/5.0" -w "%{http_code}" -o "$2" "$P$1" || echo ERR); echo "$1 -> $code $(wc -c < "$2" 2>/dev/null) bytes" >> __/auth/fetch-log.txt; [ "$code" = "200" ] || rm -f "$2"; }
          get /__/auth/handler        __/auth/handler.html
          get /__/auth/handler.js     __/auth/handler.js
          get /__/auth/experiments.js __/auth/experiments.js
          get /__/auth/iframe         __/auth/iframe.html
          get /__/auth/iframe.js      __/auth/iframe.js
          get /__/firebase/init.json  __/firebase/init.json
          cat __/auth/fetch-log.txt
      - name: Commit to main and gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Firebase sign-in helper files (self-hosted on hazem-store.com)"
          git push origin HEAD:main
          git push origin HEAD:gh-pages || echo "gh-pages push skipped"
