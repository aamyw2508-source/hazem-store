<script>try{var t=localStorage.getItem('hazem-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* Design system v3 (night-market storefront). Layout: storefront in a 1180px column under a navy hero with the shop awning from the logo; admin = right sidebar on desktop, bottom tab bar on phones */
:root{
  --bg:#f3f6fd; --surface:#ffffff; --surface-2:#edf2fc; --line:#e1e8f6; --line-2:#cad5ee;
  --fg:#0a1640; --fg-2:#34446f; --muted:#5d6a92;
  --brand:#1f55e8; --brand-hi:#1844c4; --brand-ink:#ffffff; --brand-soft:#e6eeff; --band:#1f55e8;
  --cyan:#14a9ee; --violet:#7c4ddb; --focus:#1f8fff;
  --navy:#071233; --on-navy:#eef3ff; --on-navy-2:#a9bbe9;
  --price:#1f55e8; --wa:#15803d; --wa-hi:#166534;
  --good:#0b7f53; --good-bg:#e1f5eb; --warn:#975600; --warn-bg:#fff2d6; --bad:#c32a48; --bad-bg:#fde7eb;
  --tile-bg:#ffffff; --overlay:rgba(5,12,36,.52); --glass:rgba(255,255,255,.82);
  --bar-soft:#b3c7f7;
  --ribbon:linear-gradient(115deg,#38c2f7 0%,#1f7bff 42%,#1f55e8 72%,#1a33bf 100%);
  --ring:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent);
  --shadow:0 1px 2px rgba(16,40,120,.06),0 18px 36px -22px rgba(16,40,120,.38);
  --shadow-lift:0 2px 4px rgba(16,40,120,.06),0 24px 44px -24px rgba(22,62,200,.45);
  --t-blue:#1f5fe6; --t-cyan:#0890d0; --t-violet:#7a47d6; --t-green:#0f8456; --t-amber:#ad6c00; --t-rose:#cf355c; --t-orange:#d45a16; --t-slate:#56648a;
  --f-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050a1c; --surface:#0b1430; --surface-2:#111d40; --line:#1a2851; --line-2:#26396c;
    --fg:#e9efff; --fg-2:#b4c1e6; --muted:#8190bb;
    --brand:#4a86ff; --brand-hi:#6c9dff; --brand-ink:#ffffff; --brand-soft:rgba(74,134,255,.16); --band:#1a3fb0;
    --cyan:#5fd6ff; --violet:#a78bfa; --focus:#5fd6ff;
    --navy:#030817; --on-navy:#eef3ff; --on-navy-2:#a3b4e2;
    --price:#7cc8ff; --wa:#15803d; --wa-hi:#166534;
    --good:#45d99c; --good-bg:rgba(69,217,156,.12); --warn:#ffc164; --warn-bg:rgba(255,193,100,.12); --bad:#ff6d87; --bad-bg:rgba(255,109,135,.13);
    --tile-bg:#ffffff; --overlay:rgba(0,3,14,.72); --glass:rgba(6,11,30,.78);
    --bar-soft:#26407f;
    --ribbon:linear-gradient(115deg,#4cd0ff 0%,#2f86ff 42%,#2c5ff0 72%,#2440cf 100%);
    --ring:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 36px -20px rgba(0,0,0,.8);
    --shadow-lift:0 1px 0 rgba(255,255,255,.05) inset,0 24px 48px -22px rgba(0,0,0,.85),0 0 0 1px rgba(95,214,255,.08);
    --t-blue:#5b8cff; --t-cyan:#3cc6ff; --t-violet:#ad86ff; --t-green:#45d69a; --t-amber:#ffc35c; --t-rose:#ff7896; --t-orange:#ff9a5c; --t-slate:#9aa7cc;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050a1c; --surface:#0b1430; --surface-2:#111d40; --line:#1a2851; --line-2:#26396c;
  --fg:#e9efff; --fg-2:#b4c1e6; --muted:#8190bb;
  --brand:#4a86ff; --brand-hi:#6c9dff; --brand-ink:#ffffff; --brand-soft:rgba(74,134,255,.16); --band:#1a3fb0;
  --cyan:#5fd6ff; --violet:#a78bfa; --focus:#5fd6ff;
  --navy:#030817; --on-navy:#eef3ff; --on-navy-2:#a3b4e2;
  --price:#7cc8ff; --wa:#15803d; --wa-hi:#166534;
  --good:#45d99c; --good-bg:rgba(69,217,156,.12); --warn:#ffc164; --warn-bg:rgba(255,193,100,.12); --bad:#ff6d87; --bad-bg:rgba(255,109,135,.13);
  --tile-bg:#ffffff; --overlay:rgba(0,3,14,.72); --glass:rgba(6,11,30,.78);
  --bar-soft:#26407f;
  --ribbon:linear-gradient(115deg,#4cd0ff 0%,#2f86ff 42%,#2c5ff0 72%,#2440cf 100%);
  --ring:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 36px -20px rgba(0,0,0,.8);
  --shadow-lift:0 1px 0 rgba(255,255,255,.05) inset,0 24px 48px -22px rgba(0,0,0,.85),0 0 0 1px rgba(95,214,255,.08);
  --t-blue:#5b8cff; --t-cyan:#3cc6ff; --t-violet:#ad86ff; --t-green:#45d69a; --t-amber:#ffc35c; --t-rose:#ff7896; --t-orange:#ff9a5c; --t-slate:#9aa7cc;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.65 var(--f-body);direction:rtl;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--glass)}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.i{flex:none;display:block}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.num,.money{font-variant-numeric:tabular-nums}
.money{display:inline-flex;align-items:baseline;gap:2px;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.money b{font-weight:inherit}
.money i{font-style:normal;font-size:.7em;opacity:.8}
.strike{color:var(--muted);text-decoration:line-through;font-size:12.5px;font-weight:500;white-space:nowrap}
.muted{color:var(--muted)} .good-t{color:var(--good)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}

/* ---------- tiles (app icons) */
.tile{--c:var(--t-blue);position:relative;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 22%,transparent);overflow:hidden;flex:none}
.tile .bimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:15%;background:var(--tile-bg);opacity:0;transition:opacity .2s}
.tile .bimg:not([data-remote]){padding:0}
.tile .bimg.ok{opacity:1}
.tile.has-img{background:var(--tile-bg);border-color:var(--line)}
.tile.has-img>svg{visibility:hidden}
.tile.xs{width:28px;height:28px;border-radius:8px}
.tile.sm{width:36px;height:36px;border-radius:10px}
.tile.lg{width:52px;height:52px;border-radius:15px}
.tile.xl{width:56px;height:56px;border-radius:16px}
.tile.xxl{width:68px;height:68px;border-radius:19px}

/* ---------- announce + header */
.announce{background:var(--band);color:#fff;font-size:13px;font-weight:600}
.announce .wrap{display:flex;align-items:center;justify-content:center;gap:8px;padding-block:7px;text-align:center}
.announce .mq{overflow:hidden;direction:ltr;padding-block:7px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.announce .mq-track{display:flex;width:max-content;direction:ltr;animation:mq 48s linear infinite;will-change:transform}
.announce .mq-grp{display:flex;flex:none}
.announce .mq-item{display:inline-flex;align-items:center;gap:8px;padding-inline:28px;white-space:nowrap;direction:rtl}
.announce .mq-item .i{opacity:.85;flex:none}
@media (hover:hover){.announce:hover .mq-track{animation-play-state:paused}}
@keyframes mq{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.announce .mq{-webkit-mask-image:none;mask-image:none}.announce .mq-track{animation:none;width:auto;justify-content:center}.announce .dup{display:none}.announce .mq-item{white-space:normal;text-align:center}}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:12px;height:66px}
.brand{flex:1;display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.bname{display:grid;line-height:1.2;min-width:0}
.bname b{font:700 18px/1.25 var(--f-display);letter-spacing:-.2px}
.bname small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mainnav{display:none}
.mainnav a{color:var(--fg-2);text-decoration:none;font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:10px;white-space:nowrap}
.mainnav a:hover{background:var(--surface-2);color:var(--fg)}
.hdr-act{flex:1;display:flex;justify-content:flex-end;gap:6px}
.hbtn{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--fg-2);border:1px solid var(--line);background:var(--surface)}
.hbtn:hover{color:var(--fg);border-color:var(--line-2)}
.cbadge{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--brand);color:#fff;font:700 11px/16px var(--f-body);padding:0 5px;text-align:center;border:2px solid var(--surface)}
@media (min-width:980px){.mainnav{display:flex;gap:2px}.only-m{display:none!important}.hdr-act{flex:1}}
@media (max-width:979px){.hdr-act{flex:none}}

/* ---------- hero */
.hero{position:relative;background:var(--navy);color:var(--on-navy);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(720px 420px at 88% -8%,rgba(11,78,224,.62),transparent 70%),radial-gradient(520px 320px at 6% 108%,rgba(6,166,236,.26),transparent 70%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 70% 30%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 70% 30%,#000 30%,transparent 80%)}
.awning{height:22px;background:
  radial-gradient(circle at 11px 0,#0b4ee0 0 10.5px,transparent 11px) 0 11px/44px 11px repeat-x,
  radial-gradient(circle at 33px 0,#06a6ec 0 10.5px,transparent 11px) 0 11px/44px 11px repeat-x,
  repeating-linear-gradient(90deg,#0b4ee0 0 22px,#06a6ec 22px 44px) 0 0/100% 11px no-repeat}
.hero-in{display:grid;gap:30px;padding-block:34px 86px}
.hero-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--on-navy-2);font-size:13px;font-weight:600}
.hero h1{margin:16px 0 12px;font:800 clamp(30px,7.6vw,54px)/1.24 var(--f-display);letter-spacing:-.6px;text-wrap:balance;color:#fff}
.hero h1 .hl{color:#62cdff}
.hero-txt p{margin:0;color:var(--on-navy-2);font-size:clamp(15px,2.2vw,17.5px);max-width:54ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.appcloud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.appcloud .ac{aspect-ratio:1;max-width:100%;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);display:grid;place-items:center}
.appcloud .ac:nth-child(n+6){display:none}
.appcloud .tile{width:64%;height:64%;border-radius:14px;border-color:transparent;box-shadow:0 10px 22px -10px rgba(0,0,0,.6)}
@media (min-width:900px){
  .hero-in{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;padding-block:64px 120px}
  .appcloud{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:100%;max-width:380px;justify-self:center}
  .appcloud .ac:nth-child(n+6){display:grid}
  .appcloud .ac{border-radius:26px}
  .appcloud .ac:nth-child(3n+2){transform:translateY(26px)}
  .appcloud .tile{border-radius:19px;animation:float 6s ease-in-out infinite}
  .appcloud .ac:nth-child(2n) .tile{animation-delay:-2s}
  .appcloud .ac:nth-child(3n) .tile{animation-delay:-4s}
}
@keyframes float{50%{transform:translateY(-6px)}}

/* ---------- trust strip */
.trust-wrap{position:relative;z-index:2;margin-top:-50px}
.trust{list-style:none;margin:0;padding:6px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.trust li{display:flex;gap:10px;align-items:flex-start;padding:12px;min-width:0}
.trust-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.trust b{display:block;font:700 14px/1.35 var(--f-display)}
.trust small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
@media (max-width:899px){.trust li{flex-direction:column;gap:8px;padding:12px 10px}.trust-ic{width:36px;height:36px;border-radius:11px}.trust b{font-size:13.5px}}
@media (min-width:900px){.trust{grid-template-columns:repeat(4,minmax(0,1fr));padding:10px}.trust li{padding:14px 16px}.trust li+li{border-inline-start:1px solid var(--line)}}

/* ---------- sections */
.sec{padding-top:60px;scroll-margin-top:76px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-h h2{margin:0;font:800 clamp(22px,4.6vw,30px)/1.3 var(--f-display);letter-spacing:-.3px;text-wrap:balance}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.catcard{display:flex;align-items:center;gap:12px;text-align:start;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:border-color .18s,transform .18s}
.catcard:hover{border-color:var(--brand);transform:translateY(-2px)}
.cat-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.catcard span{display:grid;min-width:0}
.catcard b{font:700 15px/1.35 var(--f-display)}
.catcard small{color:var(--muted);font-size:12.5px}
@media (max-width:560px){.catgrid{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}.catcard{flex-direction:column;align-items:flex-start;gap:8px;padding:12px}.cat-ic{width:40px;height:40px;border-radius:12px}.catcard b{font-size:13.5px}}
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;padding:12px 0;font-size:16px;color:var(--fg)}
.search:focus-within{border-color:var(--focus)}
.sortbox{flex:none;width:clamp(128px,32%,220px)}
.sortbox .inp{height:100%;border-radius:14px;background-color:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.fchip .n{opacity:.65;font-weight:500;margin-inline-start:5px}

/* ---------- product cards */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:720px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:1060px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;transition:border-color .18s,box-shadow .18s,transform .18s;min-width:0}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.pcard:has(.pc-link:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.pbadge{font:700 11.5px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.pbadge.sale{background:var(--bad-bg);color:var(--bad)}
.pc-name{margin:0;font:700 16px/1.35 var(--f-display);min-width:0}
.pc-link{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;width:100%;text-align:start;font:inherit;color:inherit;overflow:hidden;overflow-wrap:anywhere}
.pc-link::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1}
.pc-link:focus-visible{outline:none}
.pc-meta{margin:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-plans{display:flex;gap:4px;overflow:hidden;margin-top:2px}
.pc-plans span{font-size:11.5px;font-weight:600;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:8px;white-space:nowrap}
.pc-foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:10px}
.pc-price{display:grid;line-height:1.15;min-width:0}
.pc-price b{font:800 22px/1.15 var(--f-display);color:var(--price)}
.ibtn{position:relative;z-index:2;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);flex:none}
.ibtn:hover{border-color:var(--brand);color:var(--brand)}
.pc-buy{position:relative;z-index:2;margin-top:10px}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:18px;padding:26px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:16px}
.empty .i{color:var(--muted)}

/* ---------- how / pay / reviews / faq / cta */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.step-n{grid-row:span 2;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--brand);color:#fff;font:800 18px/1 var(--f-display)}
.steps b{font:700 16px/1.4 var(--f-display)}
.steps p{margin:0;color:var(--muted);font-size:14px}
.paygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.paycard{display:flex;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0}
.paycard span{display:grid;min-width:0}
.paycard b{font:700 15.5px/1.35 var(--f-display)}
.paycard small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.revgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rev{margin:0;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:grid;gap:14px;align-content:space-between}
.rev blockquote{margin:0;color:var(--fg-2);font-size:15px}
.rev figcaption{display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:800 15px/1 var(--f-display);flex:none}
.rev figcaption b{display:block;font:700 14px/1.3 var(--f-display)}
.rev figcaption small{color:var(--muted);font-size:12.5px}
.faq{display:grid;gap:10px;max-width:860px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.faq details[open]{border-color:var(--line-2)}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;font:700 15.5px/1.45 var(--f-display)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .i{transition:transform .2s;color:var(--muted)}
.faq details[open] summary .i{transform:rotate(180deg)}
.faq details p{margin:0 0 16px;color:var(--fg-2)}
.seo{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;display:grid;gap:12px}
.seo h2{margin:0;font:800 clamp(20px,4vw,26px)/1.35 var(--f-display)}
.seo h2 span{color:var(--muted);font-weight:600}
.seo p{margin:0;color:var(--fg-2);max-width:75ch}
.seo-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.seo-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13.5px}
.seo-list b{font-weight:700}
.seo-list span{color:var(--muted);font-size:12.5px}
.cta{margin-top:60px;background:var(--navy);color:#fff;border-radius:26px;padding:28px 22px;display:grid;gap:18px;position:relative;overflow:hidden;isolation:isolate}
.cta::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(520px 260px at 90% 0%,rgba(11,78,224,.6),transparent 70%)}
.cta h2{margin:0;font:800 clamp(21px,4vw,28px)/1.35 var(--f-display);text-wrap:balance}
.cta p{margin:6px 0 0;color:var(--on-navy-2)}
.cta-act{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (min-width:760px){.cta{grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:36px 40px}}
.foot{margin-top:60px;background:var(--surface);border-top:1px solid var(--line);padding-block:36px calc(96px + env(safe-area-inset-bottom,0px))}
.foot-grid{display:grid;gap:28px}
@media (min-width:860px){.foot-grid{grid-template-columns:1.5fr 1fr 1.3fr}}
.foot h3{margin:0 0 10px;font:700 14.5px/1.3 var(--f-display)}
.foot p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:46ch}
.flinks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.flinks a{color:var(--fg-2);text-decoration:none;font-size:14px}
.flinks a:hover{color:var(--brand)}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sel{user-select:all;-webkit-user-select:all;font-weight:700;color:var(--fg)}
.foot-pay{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.foot-bottom{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
.admin-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:10px}
.admin-link:hover{color:var(--brand);border-color:var(--brand)}
.fab{position:fixed;z-index:25;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:13px 18px 13px 16px;border-radius:999px;box-shadow:0 12px 26px -10px rgba(21,128,61,.75)}
.fab:hover{background:var(--wa-hi)}
.mnav{display:grid;gap:4px}
.mnav a{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:600;font-size:16px;border:1px solid var(--line)}

/* ---------- buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:600;font-size:14.5px;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover{border-color:var(--fg-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hi);border-color:var(--brand-hi)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:var(--wa-hi);border-color:var(--wa-hi)}
.btn.light{background:#fff;color:#0a1433;border-color:#fff}
.btn.light:hover{background:#e8efff;border-color:#e8efff}
.btn.ghost-l{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.24)}
.btn.ghost-l:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.block{width:100%}
.btn.lg{padding:14px 20px;font-size:15.5px;border-radius:14px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:default}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--fg-2)}
.field>span em{font-style:normal;font-weight:400;color:var(--muted)}
.inp{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:16px;color:var(--fg);outline:none}
.inp:focus{border-color:var(--focus);background:var(--surface)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.55}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:16px 52%,21px 52%;background-size:5px 5px;background-repeat:no-repeat;padding-left:34px}
.inp.ltr{direction:ltr;text-align:right}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.hint{margin:0;color:var(--muted);font-size:13px}
.err{margin:0;background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600}
.fine{margin:0;color:var(--muted);font-size:12.5px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--warn-bg);color:var(--warn)}
.pill.done{background:var(--good-bg);color:var(--good)}
.pill.cancelled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.info{background:var(--brand-soft);color:var(--brand)}

/* ---------- sheets */
.ov{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:600px;max-height:calc(100dvh - 18px - env(safe-area-inset-top,0px));overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;animation:up .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sh-head{position:sticky;top:0;z-index:4;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font:700 17px/1.3 var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-body{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
@media (min-width:720px){.ov{align-items:center;padding:24px}.sheet{border-radius:24px;border-bottom:1px solid var(--line);max-height:calc(100dvh - 48px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg-2);border:1px solid var(--line);background:var(--surface);flex:none;text-decoration:none}
.icon-btn:hover{color:var(--fg);border-color:var(--line-2)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.icon-btn:disabled{opacity:.4}
.pd-head{display:flex;gap:14px;align-items:center}
.pd-head h3{margin:0;font:800 21px/1.3 var(--f-display)}
.pd-head span{display:grid;min-width:0}
.pd-desc{margin:0;color:var(--fg-2)}
.ostep{display:grid;gap:10px}
.ostep h3,.ostep h4{margin:0;display:flex;align-items:center;gap:8px;font:700 15px/1.3 var(--f-display)}
.sn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:700 12.5px/1 var(--f-display);flex:none}
.plans{display:grid;gap:8px}
.plan{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--surface);text-align:start}
.plan[aria-checked="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.plan[aria-checked="true"] .radio{border-color:var(--brand)}
.plan[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.pl-n{flex:1;font-weight:700;font-size:15px;min-width:0}
.pl-p{display:flex;align-items:baseline;gap:8px;font:800 17px/1.2 var(--f-display);color:var(--price)}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feat li{display:flex;gap:8px;align-items:flex-start;color:var(--fg-2)}
.feat .i{color:var(--good);margin-top:4px}
.pd-foot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:10px;background:var(--surface);border-top:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) calc(-22px - env(safe-area-inset-bottom,0px)) calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pd-foot .btn.primary{flex:1}
.co-sum{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.co-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.ci-info{flex:1;min-width:0;display:grid}
.ci-info b{font:600 14.5px/1.35 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-info small{color:var(--muted);font-size:12.5px}
.co-item>.money{font-weight:700}
.co-total{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--surface-2);font-weight:700}
.co-total .money{font:800 22px/1.1 var(--f-display);color:var(--price)}
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.method{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--surface);text-align:start;font-weight:600;font-size:14px;min-width:0}
.method span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.method[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.paybox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:12px;color:var(--muted);grid-column:1}
.kv .v{font:700 16px/1.35 var(--f-display);grid-column:1;overflow-wrap:anywhere}
.kv .copy{grid-column:2;grid-row:1/span 2}
.copy{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--fg-2)}
.copy.ok{color:var(--good);border-color:var(--good)}
.paynote{margin:0;padding:10px 12px;font-size:13px;color:var(--fg-2);background:var(--surface)}
.upl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.done{display:grid;gap:12px;justify-items:center;text-align:center;padding-block:8px}
.done-ic{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:var(--good-bg);color:var(--good)}
.done h3{margin:0;font:800 22px/1.3 var(--f-display)}
.done p{margin:0;color:var(--fg-2)}
.clist{display:grid;gap:10px}
.citem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px}
.ci-price{font-weight:700;color:var(--price)}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:12px;padding:2px}
.qty button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--fg-2)}
.qty button:hover{background:var(--surface-2)}
.qty span{min-width:22px;text-align:center;font-weight:700}
.ctotal{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:14px;background:var(--surface-2);font-weight:700}
.ctotal .money{font:800 22px/1.1 var(--f-display);color:var(--price)}
.ask-t{margin:0;color:var(--fg-2)}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);animation:up .2s ease}
.toast button{color:var(--bg);font-weight:800;text-decoration:underline;white-space:nowrap}

/* ---------- login */
.login{min-height:100vh;display:grid;place-items:center;align-content:center;gap:16px;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--navy) 0,var(--navy) 300px,var(--bg) 300px)}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.login-ic{width:80px;height:80px;border-radius:22px;justify-self:center;box-shadow:0 14px 28px -12px rgba(11,78,224,.6)}
.login-card h1{margin:0;text-align:center;font:800 22px/1.35 var(--f-display)}
.login-card>p{margin:0;text-align:center}
.login-foot{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px}
.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px}
.alert>span{display:flex;align-items:center;gap:8px}
.alert.info{background:var(--brand-soft);color:var(--fg-2);font-weight:500}
.alert.info .i{color:var(--brand)}

/* ---------- admin layout */
.adm{min-height:100vh}
@media (min-width:960px){.adm{display:grid;grid-template-columns:268px minmax(0,1fr)}}
.side{display:none}
@media (min-width:960px){.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-inline-end:1px solid var(--line);padding:22px 14px}}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 6px;min-width:0}
.side-brand img{width:44px;height:44px;border-radius:12px;flex:none}
.side-brand span{display:grid;min-width:0;line-height:1.25}
.side-brand b{font:800 16px/1.25 var(--f-display)}
.side-brand small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-nav{display:grid;gap:4px;margin-top:10px}
.snav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--fg-2);font-weight:600;font-size:14.5px;text-decoration:none;width:100%;text-align:start}
.snav:hover{background:var(--surface-2);color:var(--fg)}
.snav[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.snav .cnt{margin-inline-start:auto;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;line-height:22px;text-align:center;padding:0 6px}
.side-foot{margin-top:auto;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:10px;margin-bottom:6px}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.conn.on{color:var(--good);background:var(--good-bg)}
.conn.off{color:var(--warn);background:var(--warn-bg)}
.atop{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.atop-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.atop .side-brand{padding:0}
.atop .side-brand img{width:40px;height:40px;border-radius:11px}
.top-actions{display:flex;gap:8px}
@media (min-width:960px){.atop{display:none}}

/* ---------- accounts, balance & instant delivery */
.udot{position:absolute;top:6px;left:6px;width:10px;height:10px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}

.wcard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;isolation:isolate}

/* ================================================================
   Design system v3 · components
   One loud thing: the ribbon gradient from the logo (primary actions + hero mark).
   Everything else stays quiet: thin borders, tinted shadows only on lift.
   ================================================================ */
body{font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--brand) 26%,transparent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* buttons */
.btn{border-radius:13px;font-family:var(--f-display);font-weight:600;letter-spacing:-.1px;transition:background .18s,border-color .18s,color .18s,box-shadow .18s,transform .12s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ribbon);background-size:160% 100%;background-position:0 0;border-color:transparent;color:#fff;box-shadow:0 10px 22px -12px rgba(31,85,232,.75),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.primary:hover{background:var(--ribbon);background-size:160% 100%;background-position:100% 0;border-color:transparent;box-shadow:0 14px 28px -12px rgba(31,85,232,.85),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.light{background:#fff;color:#0a1640;border-color:#fff;box-shadow:0 12px 26px -14px rgba(0,0,0,.55)}
.btn.ghost-l{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22)}
.btn.lg{border-radius:15px;padding:14px 22px}
.btn.wa{box-shadow:0 10px 22px -14px rgba(21,128,61,.8)}

/* inputs */
.inp{border-radius:13px;transition:border-color .15s,box-shadow .15s,background .15s}
.inp:focus{border-color:var(--brand);box-shadow:var(--ring)}
.search{border-radius:15px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--brand);box-shadow:var(--ring)}
.fchip{font-family:var(--f-display);font-weight:500;transition:background .15s,border-color .15s,color .15s}
.fchip:hover{border-color:var(--brand);color:var(--fg)}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* header */
.hdr{background:var(--glass)}
.bname b{font:700 18.5px/1.25 var(--f-display)}
.mainnav a{font-family:var(--f-display);font-weight:500;font-size:14.5px}
.mainnav a:hover{background:var(--brand-soft);color:var(--brand)}
.hbtn{border-radius:13px;transition:border-color .15s,color .15s,background .15s}
.hbtn:hover{border-color:var(--brand);color:var(--brand)}
.thbtn .i-moon{display:none}
:root[data-theme="dark"] .thbtn .i-sun{display:block}
:root[data-theme="dark"] .thbtn .i-moon{display:none}
.thbtn .i-sun{display:none}.thbtn .i-moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thbtn .i-sun{display:block}:root:not([data-theme="light"]) .thbtn .i-moon{display:none}}
:root[data-theme="dark"] .thbtn .i-sun{display:block}:root[data-theme="dark"] .thbtn .i-moon{display:none}
:root[data-theme="light"] .thbtn .i-sun{display:none}:root[data-theme="light"] .thbtn .i-moon{display:block}
.throw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;font-weight:600}
.throw .seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.throw .seg button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.throw .seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* hero */
.hero h1{font:700 clamp(32px,7.4vw,58px)/1.18 var(--f-display);letter-spacing:-1px}
.hero h1 .hl{display:block;color:inherit}
.hero-txt p{font-size:clamp(15.5px,2.2vw,18px);line-height:1.75}
.hero-pill{font-family:var(--f-display);font-weight:500}
.hero::before{background:radial-gradient(760px 460px at 86% -10%,rgba(31,110,255,.62),transparent 70%),radial-gradient(560px 360px at 8% 110%,rgba(56,194,247,.28),transparent 70%),radial-gradient(420px 260px at 40% 120%,rgba(26,51,191,.5),transparent 70%)}
.hero-mark{position:absolute;z-index:-1;inset-inline-end:-6%;top:50%;width:min(620px,92vw);aspect-ratio:1;transform:translateY(-50%);opacity:.16;pointer-events:none;filter:drop-shadow(0 30px 60px rgba(31,110,255,.5))}
.hero-mark svg{width:100%;height:100%;display:block}
@media (min-width:900px){.hero-mark{inset-inline-end:2%;opacity:.22;width:560px}}
@media (max-width:899px){.hero-mark{top:auto;bottom:-14%;transform:none;opacity:.12}}
.appcloud .ac{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.awning{background:
  radial-gradient(circle at 11px 0,#1f55e8 0 10.5px,transparent 11px) 0 11px/44px 11px repeat-x,
  radial-gradient(circle at 33px 0,#38c2f7 0 10.5px,transparent 11px) 0 11px/44px 11px repeat-x,
  repeating-linear-gradient(90deg,#1f55e8 0 22px,#38c2f7 22px 44px) 0 0/100% 11px no-repeat}
.announce{background:var(--ribbon)}

/* sections */
.sec{padding-top:72px}
@media (max-width:759px){.sec{padding-top:56px}}
.sec-h{margin-bottom:22px}
.sec-h h2{font:700 clamp(24px,4.6vw,34px)/1.25 var(--f-display);letter-spacing:-.6px}
.sec-h p{font-size:15px;margin-top:6px}
.trust{border-radius:24px}
.trust b{font:600 14.5px/1.4 var(--f-display)}
.trust-ic{border-radius:13px}
.catcard{border-radius:18px;transition:border-color .18s,box-shadow .18s,transform .18s}
.catcard:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));box-shadow:var(--shadow-lift)}
.catcard b{font:600 15px/1.35 var(--f-display)}

/* product cards */
.pcard{border-radius:20px;padding:16px;gap:7px;transition:border-color .2s,box-shadow .2s,transform .2s}
.pcard:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));box-shadow:var(--shadow-lift);transform:translateY(-3px)}
.pc-name{font:600 16.5px/1.35 var(--f-display);letter-spacing:-.2px}
.pc-price b{font:700 23px/1.1 var(--f-display);letter-spacing:-.4px}
.pbadge{font-family:var(--f-display);font-weight:600}
.ibtn{border-radius:13px;transition:border-color .15s,color .15s,background .15s}
.ibtn:hover{background:var(--brand-soft)}

/* steps, pay, reviews, faq */
.steps li{border-radius:22px;padding:20px}
.step-n{background:var(--ribbon);border-radius:14px;font:700 18px/1 var(--f-display);box-shadow:0 10px 20px -12px rgba(31,85,232,.8)}
.steps b{font:600 16.5px/1.4 var(--f-display)}
.paycard{border-radius:18px}
.paycard b{font:600 15.5px/1.35 var(--f-display)}
.rev{border-radius:22px}
.revsum{border-radius:24px}
.faq details{border-radius:18px;transition:border-color .2s,background .2s}
.faq details[open]{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.faq summary{font:600 15.5px/1.5 var(--f-display)}
.seo{border-radius:24px}
.cta{border-radius:28px}
.cta::before{background:radial-gradient(560px 280px at 90% 0%,rgba(31,110,255,.62),transparent 70%),radial-gradient(360px 200px at 0% 100%,rgba(56,194,247,.25),transparent 70%)}
.cta h2{font-weight:700}
.foot h3{font:600 15px/1.3 var(--f-display)}

/* sheets */
.sheet{border-radius:26px 26px 0 0;box-shadow:0 -20px 60px -30px rgba(0,0,0,.5)}
@media (min-width:720px){.sheet{border-radius:26px}}
.sh-head h2{font:600 17.5px/1.3 var(--f-display)}
.plan[aria-checked="true"],.method[aria-pressed="true"]{border-color:var(--brand);box-shadow:var(--ring)}
.done h3,.pd-head h3{font-weight:700}

/* admin */
.a-h h1{font:700 26px/1.25 var(--f-display);letter-spacing:-.5px}
.card,.kpi{border-radius:22px}
.kpi .lbl{font:600 14px/1.3 var(--f-display)}
.kpi .val{font:700 28px/1.1 var(--f-display);letter-spacing:-.6px}
.kpi.big{background:var(--navy);color:var(--on-navy);border-color:transparent;position:relative;overflow:hidden;isolation:isolate}
.kpi.big::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(420px 220px at 100% 0,rgba(31,110,255,.6),transparent 70%),radial-gradient(300px 180px at 0 100%,rgba(56,194,247,.22),transparent 70%)}
.kpi.big .val{font-size:48px;color:#fff}
.kpi.big .cap,.kpi.big .date,.kpi.big .cmp,.kpi.big dt{color:var(--on-navy-2)}
.kpi.big .kgrid{border-top-color:rgba(255,255,255,.12)}
.kpi.big .srcsplit .src{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:var(--on-navy-2)}
.kpi.big .srcsplit .src .money{color:#fff}
.kpi.big .srcsplit .src small{color:var(--on-navy-2)}
.kpi.big .bad-t{color:#ff8fa3}
.snav{font-family:var(--f-display);font-weight:500;border-radius:13px}
.snav[aria-current="page"]{background:var(--brand-soft);color:var(--brand);box-shadow:inset -3px 0 0 var(--brand)}
.anav button{font-family:var(--f-display);font-weight:500}
.side{background:var(--surface)}
.orow,.arow,.subrow,.mrow{border-radius:18px}
.orow{transition:border-color .15s,box-shadow .15s}
.orow:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.login{background:radial-gradient(700px 360px at 80% -5%,rgba(31,110,255,.45),transparent 70%),linear-gradient(180deg,var(--navy) 0,var(--navy) 320px,var(--bg) 320px)}
.login-card{border-radius:26px}
.side-foot .thbtn,.top-actions .thbtn{width:40px;height:40px}

/* ---------------------------------------------------------------- scroll reveal
   Each block rises 16px and fades in once, the first time it enters the screen.
   Items that enter together are staggered by 60ms in reading order. */
.rv{opacity:0;transform:translate3d(0,44px,0) scale(.97);transition:opacity .8s cubic-bezier(.2,.7,.2,1) var(--rv-d,0ms),transform 1s cubic-bezier(.16,1,.3,1) var(--rv-d,0ms)}
.rv.rv-pop{transform:translate3d(0,30px,0) scale(.86)}
.rv.rv-side{transform:translate3d(0,38px,0) scale(.92) rotate(-1.5deg);transform-origin:100% 0}
.rv.rv-fade{transform:none}
.rv.in{opacity:1;transform:none}
.hero-mark.rv{transform:translateY(-50%) scale(.82) rotate(-6deg);transition-duration:1.4s,1.8s}
.hero-mark.rv.in{transform:translateY(-50%)}
@media (max-width:899px){.hero-mark.rv{transform:scale(.82) rotate(-6deg)}.hero-mark.rv.in{transform:none}}
.rv.rv-soft,.hero-mark.rv.rv-soft{transform:none;transition:opacity .9s ease var(--rv-d,0ms)}
.rv.rv-soft.in{opacity:1}
@media (prefers-reduced-motion:reduce){.hero-mark.rv.rv-soft{transform:translateY(-50%)}}
@media (prefers-reduced-motion:reduce) and (max-width:899px){.hero-mark.rv.rv-soft{transform:none}}

.only-d{display:none!important}
@media (min-width:980px){.only-d{display:grid!important}}
.snav.thbtn,.side-foot [data-act=themeToggle]{}
.side-foot [data-act=themeToggle] .i-sun{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side-foot [data-act=themeToggle] .i-sun{display:block}:root:not([data-theme="light"]) .side-foot [data-act=themeToggle] .i-moon{display:none}}
:root[data-theme="dark"] .side-foot [data-act=themeToggle] .i-sun{display:block}:root[data-theme="dark"] .side-foot [data-act=themeToggle] .i-moon{display:none}
.chart .chart-empty svg{width:24px;height:24px}
.ksub .i,.srcsplit .i{display:inline-block;vertical-align:-2px}
#main,.amain{overflow-x:clip}


/* ---------- loading screen */
.boot{min-height:100vh;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:16px;padding:24px;background:var(--bg);color:var(--fg);animation:bootFade .35s ease both}
.boot-card{width:112px;height:112px;border-radius:32px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-lift);animation:bootPop .6s cubic-bezier(.2,.9,.25,1.2) both}
.boot-mark{width:84px;height:84px;overflow:visible}
.boot-bar0{fill:#0b2e8a}
.boot-sc{transform-box:fill-box;transform-origin:50% 0;animation:bootWave 1.3s ease-in-out infinite}
.boot-sc:nth-of-type(2){animation-delay:.12s}.boot-sc:nth-of-type(3){animation-delay:.24s}.boot-sc:nth-of-type(4){animation-delay:.36s}
.boot-lt{transform-box:fill-box;transform-origin:50% 50%;animation:bootFloat 2.6s ease-in-out infinite}
.boot-name{font:700 19px/1.3 var(--f-display);letter-spacing:-.2px;animation:bootFade .5s .15s ease both}
.boot-line{position:relative;width:132px;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;animation:bootFade .5s .25s ease both}
.boot-line i{position:absolute;top:0;bottom:0;right:0;width:42%;border-radius:inherit;background:var(--ribbon);animation:bootRun 1.15s cubic-bezier(.45,0,.2,1) infinite}
@keyframes bootFade{from{opacity:0}}
@keyframes bootPop{from{opacity:0;transform:scale(.8)}}
@keyframes bootWave{0%,55%,100%{transform:scaleY(1)}25%{transform:scaleY(1.5)}}
@keyframes bootFloat{50%{transform:translateY(-3px)}}
@keyframes bootRun{from{transform:translateX(105%)}to{transform:translateX(-245%)}}

/* ---------- phones: same look on iPhone, Samsung and Xiaomi widths */
.bname b{white-space:nowrap}
@media (max-width:599px){
  .hero-mark{display:none}
  .hero-cta{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .hero-cta .btn{width:100%}
}
@media (max-width:420px){
  .hdr-in{gap:8px}
  .hdr-act{gap:5px}
  .hbtn{width:39px;height:39px;border-radius:12px}
  .logo{width:40px;height:40px;border-radius:11px}
  .bname b{font-size:17px}
}
@media (max-width:399px){.bname small{display:none}}
.pc-plans{flex-wrap:wrap;max-height:54px}
.pc-plans span{max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* ---------- product questions + reminder title */
.askbox{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.ask-p{font:700 14px/1.3 var(--f-display)}
.ci-ask{display:block;margin-top:4px;padding:6px 8px;border-radius:8px;background:var(--surface-2);color:var(--fg-2);font-size:12.5px;line-height:1.6}
#sub-remind .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
#sub-remind .seg button{padding:6px 12px;font-size:13px;font-weight:600;color:var(--fg-2)}
#sub-remind .seg button[aria-pressed="true"]{background:var(--brand);color:#fff}

/* ---------- category rows (horizontal scroll) */
.prows{display:grid;gap:26px}
.prow{display:grid;gap:12px;min-width:0}
.prow-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prow-h h3{margin:0;display:flex;align-items:center;gap:8px;font:700 17px/1.3 var(--f-display);min-width:0}
.prow-h h3 small{font:600 12px/1 var(--f-body);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:4px 8px;border-radius:999px}
.prow-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.prow-nav{display:flex;align-items:center;gap:6px;flex:none}
.hr-btn{display:none}
.hr-btn:disabled{opacity:.35;cursor:default}
@media (hover:hover) and (min-width:720px){.hr-btn{display:grid}.prow.no-scroll .hr-btn{display:none}}
.hrow{--gut:max(16px,env(safe-area-inset-right,0px));display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 12px) / 2.15);gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gut);margin-inline:calc(-1 * var(--gut));padding:6px var(--gut) 14px;margin-block:-6px -14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hrow::-webkit-scrollbar{display:none}
.hrow>.pcard{scroll-snap-align:start}
@media (min-width:600px){.hrow{grid-auto-columns:calc((100% - 24px) / 3.15)}}
@media (min-width:760px){.hrow{--gut:max(28px,env(safe-area-inset-right,0px));gap:16px;grid-auto-columns:calc((100% - 32px) / 3.2)}}
@media (min-width:1060px){.hrow{grid-auto-columns:calc((100% - 48px) / 4)}}
/* ---------- customer's own account */
.acct-note{display:flex;gap:8px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;font-weight:600;line-height:1.6}
.acct-note .i{margin-top:3px}
.acct-note b{color:inherit}
.acctbox{padding:14px;border:1.5px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:16px;background:var(--surface)}
.pass-w{position:relative;display:block}
.pass-w .inp{padding-left:48px}
.pass-w .icon-btn{position:absolute;left:5px;top:50%;transform:translateY(-50%);border:0;background:none}
.acct-tips{margin:0;padding:0 18px 0 0;color:var(--muted);font-size:12.5px;line-height:1.7}
.pc-acct{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:8px}

.pl-n .pl-acct-t{display:block;margin-top:3px;font:600 11.5px/1.3 var(--f-body);color:var(--muted)}
.pl-n .pl-acct-t.on{color:var(--warn)}

/* ---------- floating buttons: support + WhatsApp */
.fabs{position:fixed;z-index:25;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fabs .fab{position:relative;left:auto;bottom:auto;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;padding:11px 18px 11px 14px;border-radius:999px;border:0;cursor:pointer;font-size:14.5px}
.fab-sup{background:var(--ribbon);color:#fff;box-shadow:0 12px 26px -10px rgba(31,85,232,.7)}
.fab-wa{background:#fff;color:#128c4a;border:1.5px solid #25d366!important;box-shadow:0 12px 26px -12px rgba(18,140,74,.6)}
.fab-wa:hover{background:#f2fff7}
.wa-ic{position:relative;width:26px;height:26px;display:grid;place-items:center;color:#128c4a;flex:none}
.wa-ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:50%}
.sup-n{position:absolute;top:-4px;left:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font:700 11px/20px var(--f-body);text-align:center;border:2px solid var(--bg)}
@media (max-width:599px){
  .fabs .fab{width:52px;height:52px;padding:0;justify-content:center;border-radius:50%}
  .fabs .fab .fab-t{display:none}
  .fabs .wa-ic{width:30px;height:30px}
}
.foot-sup{margin-bottom:10px}
/* ---------- support sheet */
.tkrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:start}
.tkrow.new{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:color-mix(in srgb,var(--brand) 5%,var(--surface))}
.tk-t{flex:1;display:grid;gap:3px;min-width:0}
.tk-t b{font:600 14.5px/1.35 var(--f-display)}
.tk-t small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-m{display:grid;justify-items:end;gap:4px;flex:none}
.tk-m small{color:var(--muted);font-size:11.5px}
.tk-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px}
.thread{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px}
.msg{max-width:86%;align-self:flex-end;display:grid;gap:4px;padding:10px 12px;border-radius:16px 16px 16px 4px;background:var(--surface);border:1px solid var(--line)}
.msg.mine{align-self:flex-start;border-radius:16px 16px 4px 16px;background:color-mix(in srgb,var(--brand) 12%,var(--surface));border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.msg b{font:700 12px/1.3 var(--f-display);color:var(--brand)}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;color:var(--fg)}
.msg small{color:var(--muted);font-size:11px}
.msg-img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.sup-faq details{padding:0 14px}
.sup-faq summary{font-size:14.5px;padding:13px 0}
.sup-wa{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--line-2);border-radius:14px;color:var(--fg-2);font-size:14px}
.btn.wa-btn{background:#fff;color:#128c4a;border:1.5px solid #25d366;text-decoration:none}
.fab-sup:hover{background:var(--ribbon);filter:brightness(1.06)}

/* ---------- supplier catalogue */
.sprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.sp-info{display:grid;gap:8px;min-width:0}
.sp-info>b{font:700 15px/1.3 var(--f-display)}
.sp-pl{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:center}
.sp-pl>span{display:grid;font-size:13.5px;font-weight:600;min-width:0}
.sp-pl small{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.sp-pl em{grid-column:1/-1;font-style:normal;font-size:12.5px;font-weight:600}
.sp-pr .inp{padding:9px 10px;text-align:center}
.sp-rate{max-width:220px}
.sp-desc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;color:var(--muted);font-size:12.5px;line-height:1.6}

/* ---------- warranty */
.pl-n .pl-war-t{display:flex;align-items:center;gap:4px;margin-top:3px;font:600 11.5px/1.3 var(--f-body);color:var(--muted)}
.pl-n .pl-war-t.yes{color:var(--good)}
.pc-war{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--good);background:var(--good-bg);padding:3px 8px;border-radius:8px}
.war-note{display:flex;gap:8px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--fg-2);font-size:13.5px;line-height:1.6}
.war-note.yes{background:var(--good-bg);color:var(--good)}
.war-note .i{margin-top:3px;flex:none}
.war-note a{color:inherit;font-weight:700}
.ci-war{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.ci-war.yes{color:var(--good)} .ci-war.gone{color:var(--bad)}
small.ci-war{display:flex;margin-top:3px}
.foot-pol{display:flex;flex-wrap:wrap;gap:6px 14px}
.foot-pol a{color:var(--muted);text-decoration:none}
.foot-pol a:hover{color:var(--brand)}
.fine a{color:inherit;text-decoration:underline}

.seo-list a{color:inherit;text-decoration:none}.seo-list a:hover{color:var(--brand);text-decoration:underline}

/* ---------- USDT box */
.usdt-box{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.usdt-amt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--brand) 40%,var(--line))}
.usdt-amt span{font-size:13px;color:var(--muted);font-weight:600}
.usdt-amt b{font:800 24px/1.1 var(--f-display);color:var(--price);font-variant-numeric:tabular-nums}
.usdt-qr{justify-self:center;width:190px;max-width:70%;aspect-ratio:1;background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.usdt-qr svg{display:block;width:100%;height:100%}
.usdt-box .kv{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.usdt-box .kv .v{font-size:13.5px;direction:ltr;text-align:left}
.usdt-tips{margin:0;padding:0 18px 0 0;font-size:12.5px;line-height:1.7;color:var(--fg-2)}
.usdt-st{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--line-2);font-size:13.5px;font-weight:600}
.usdt-st span{display:flex;align-items:center;gap:8px}
.usdt-st .ok{color:var(--good)} .usdt-st .bad{color:var(--warn)} .usdt-st .wait{color:var(--fg-2)}
.usdt-st a{font-size:12.5px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--brand);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== USDT networks + payment screen ===== */
.netpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.netb{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:start;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font:inherit;min-height:56px}
.netb .radio{grid-row:1/3}
.netb b{font:800 15px/1.2 var(--f-display);letter-spacing:.02em;text-align:start}
.netb small{font-size:12px;color:var(--muted)}
.netb[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.netb[aria-checked="true"] .radio{border-color:var(--brand)}
.netb[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.netb:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.netrow{margin-block:2px 10px}
.net-one{margin:0 0 8px;font-size:13.5px;color:var(--fg-2)}
.srv-hint{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.srv-hint .i{flex:none;margin-top:3px;color:var(--brand)}
.payv{display:grid;gap:12px}
.payv h3{margin:0}
.payv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.payv-left{font:700 13px/1.2 var(--f-display);color:var(--fg-2);font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.payv-left.late{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.payv .fine{margin:0}
.payv-sw{justify-self:center;width:auto}
.pay-ok .pill{display:inline-flex;align-items:center;gap:6px}
.pay-codes{display:grid;gap:8px;width:100%;text-align:start}
.pay-last{display:grid;gap:8px;width:100%;padding:14px;border-radius:16px;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));text-align:start}
.pay-last b{display:flex;align-items:center;gap:6px;color:var(--brand)}
.pay-last p{margin:0}
.done-ic.bad{background:var(--warn-bg);color:var(--warn)}
.pill.wait{background:var(--surface-2);color:var(--fg-2);border:1px dashed var(--line-2)}
.paybar{position:fixed;inset-inline:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:70;max-width:520px;margin-inline:auto;display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lift);animation:pb-in .35s ease both}
.paybar .pb-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.paybar .pb-t .i{flex:none;color:var(--brand)}
@keyframes pb-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.paybar{animation:none}}
.mrow .btn.sm.primary{margin-top:8px;justify-self:start}
/* ===== phone with country code, balance + another method, sign in first ===== */
.phone-w{display:grid;grid-template-columns:minmax(0,8.8em) minmax(0,1fr);gap:6px;direction:ltr}
.phone-w .cc{padding-inline:10px 4px;font-size:14px;text-overflow:ellipsis;min-width:0}
.phone-w input{min-width:0}
.row2:has(.phone-w){grid-template-columns:minmax(0,1fr)}
.usebal{margin-top:10px;padding:12px 14px;border-radius:14px;border:1.5px dashed color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--brand-soft);align-items:flex-start;line-height:1.65;font-weight:500}
.usebal input{margin-top:2px;flex:none}
.usebal b{font-weight:800;color:var(--fg)}
.co-sum .co-sub{background:var(--surface);border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--fg-2);padding-block:10px}
.co-sum .co-due{border-top:1px dashed var(--line)}
.co-need{margin:0 0 12px}
.co-need span{display:flex;gap:8px;align-items:flex-start}
.co-need .i{flex:none;margin-top:2px}
.wlow+.btn+.btn{margin-top:8px}
body.locked .paybar{display:none}
</style>
</head>

/* ================= helpers ================= */
function $(s,r){return (r||D).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||D).querySelectorAll(s))}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function latin(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776})}
function num(v){var n=parseFloat(latin(v).replace(/[^\d.\-]/g,''));return isFinite(n)?n:0}
function numOrNull(v){return String(v==null?'':v).trim()===''?null:num(v)}
function fmt(n){n=Math.round((+n||0)*100)/100;return n.toLocaleString('en-US',{maximumFractionDigits:2})}
function cur(){return (S.settings&&S.settings.currency)||'₪'}
function money(n,cls){return '<span class="money'+(cls?' '+cls:'')+'"><b>'+fmt(n)+'</b><i>'+esc(cur())+'</i></span>'}
function strike(n){return '<s class="strike" dir="ltr">'+fmt(n)+esc(cur())+'</s>'}
function pctTxt(n){return (Math.round(n*10)/10).toLocaleString('en-US',{maximumFractionDigits:1})+'%'}
function pct(n){return '<span class="num" dir="ltr">'+pctTxt(n)+'</span>'}
function clone(o){return JSON.parse(JSON.stringify(o))}
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function addDays(t,n){var d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()}
function weekStart(t){var d=new Date(dayStart(t));d.setDate(d.getDate()-((d.getDay()-WEEK_START+7)%7));return d.getTime()}
function monthStart(t){var d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),1).getTime()}
function addMonths(t,n){var d=new Date(t);return new Date(d.getFullYear(),d.getMonth()+n,1).getTime()}
function fdate(t,o){try{return new Intl.DateTimeFormat('ar-u-nu-latn',o).format(new Date(t))}catch(e){return new Date(t).toLocaleDateString()}}
function dayLabel(t){var s=dayStart(t),today=dayStart(Date.now());if(s===today)return 'اليوم';if(s===addDays(today,-1))return 'أمس';return fdate(t,{weekday:'long',day:'numeric',month:'long'})}
function ftime(t){return fdate(t,{hour:'numeric',minute:'2-digit'})}
function isoDay(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function intlDigits(p){var s=latin(p||'').trim();if(s.charAt(0)==='+')return s.slice(1).replace(/\D/g,'');var d=s.replace(/\D/g,'');if(d.indexOf('00')===0)return d.slice(2);if(/^05[69]/.test(d))return '970'+d.slice(1);if(/^05/.test(d))return '972'+d.slice(1);return d}
function waDigits(){return intlDigits((S.settings&&S.settings.whatsapp)||'')}
function waPretty(){var d=waDigits();if(d.length===12&&/^97[02]/.test(d))return '+'+d.slice(0,3)+' '+d.slice(3,5)+' '+d.slice(5,8)+' '+d.slice(8);return '+'+d}
function waLink(text,to){return 'https://wa.me/'+(to||waDigits())+(text?'?text='+encodeURIComponent(text):'')}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return v===undefined?null:false}}
function newOrderNo(){return 'HZ-'+(10000+Math.floor(Math.random()*90000))}
function smooth(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}catch(e){return 'auto'}}

function r2(v){return Math.round(v*100)/100}
function myBal(){return S.wallet?Math.floor((+S.wallet.balance||0)*100)/100:0}

function coPayable(){return r2(coTotal()-coWalletPart())}

function logsOrders(){return S.settings.siteOrders!==false}
function orderText(){
  var o=S.co,m=curMethod(),st=S.settings,lines=coLines();
  var L=['مرحباً '+st.storeName+'، طلب جديد رقم '+o.no+':'];
  lines.forEach(function(x){L.push('- '+x.p.name+' ('+x.plan.name+warSuffix(x.plan,'، ')+')'+(x.qty>1?' ×'+x.qty:'')+': '+fmt(x.plan.price*x.qty)+' '+cur());askText(x.p.id,o.ans).forEach(function(t){L.push('   • '+t)})});
  L.push('المجموع: '+fmt(coTotal())+' '+cur());var wpx=coWalletPart();if(wpx)L.push('من رصيدي: '+fmt(wpx)+' '+cur(),'الباقي اللي بدفعه: '+fmt(coPayable())+' '+cur());
  if(m)L.push('طريقة الدفع: '+m.name);
  if(isAutoUsdt(m)&&o.usdt&&o.usdt.amt)L.push('المبلغ المحوّل: '+o.usdt.amt+' USDT ('+NETS[o.usdt.net||'bsc'].name+')'+(o.usdt.found?' · وصلت ✓':''));
  if(m&&o.proof.trim())L.push((m.proofLabel||'تفاصيل الحوالة')+': '+o.proof.trim());
  if(o.img)L.push(CLOUD&&logsOrders()?'رفعت سكرين الحوالة مع الطلب على الموقع.':'رح أبعت سكرين الحوالة هون بالمحادثة.');
  if(o.name.trim())L.push('الاسم: '+o.name.trim());

  if(acctNeed())L=L.concat(acctText(o));else if(o.email.trim())L.push('إيميل التفعيل: '+o.email.trim());
  return L.join('\n');
}
function updateSendHref(){var a=$('#co-send');if(a&&S.co)a.href=waLink(orderText())}
function validateOrder(){var o=S.co,m=curMethod(),e=askMissing().concat(acctErrors()),pr=o.proof.trim();
  if(!m)e.push('اختار طريقة الدفع.');
  if(!pr&&!o.img)e.push('اكتب '+((m&&m.proofLabel)||'تفاصيل الحوالة')+' أو ارفع سكرين الحوالة.');
  else if(pr&&m&&m.proofType==='tel'&&!o.img&&latin(pr).replace(/\D/g,'').length<9)e.push('رقم الجوال لازم يكون 10 أرقام، مثل 0599123456.');
  if(o.name.trim().length<2)e.push('اكتب اسمك.');
  var pe=phoneErr(o.phone,false);if(pe)e.push(pe);
  if(!acctNeed()&&o.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email.trim()))e.push('الإيميل مش مكتوب صح.');
  return e}
function sendOrder(el,ev){
  var o=S.co;if(!o){ev.preventDefault();return}var errs=validateOrder(),box=$('#co-err');
  if(errs.length){ev.preventDefault();box.innerHTML=errs.map(esc).join('<br>');box.hidden=false;box.scrollIntoView({behavior:smooth(),block:'center'});return}
  box.hidden=true;updateSendHref();
  var m=curMethod(),href=el.href,lines=coLines();
  store('hazem-me',{name:o.name.trim(),phone:o.phone.trim()});
  if(logsOrders()){
    var rec={orderNo:o.no,items:lines.map(function(x){var it={productId:x.p.id,productName:String(x.p.name).slice(0,100),planId:x.plan.id,planName:String(x.plan.name).slice(0,60),price:+x.plan.price||0,qty:x.qty},inf=askText(x.p.id,o.ans).join(' | ').slice(0,600);if(inf)it.info=inf;return it}),total:coTotal(),customer:o.name.trim().slice(0,60),phone:o.phone.trim().slice(0,20),email:o.email.trim().slice(0,100),payment:m?String(m.name).slice(0,60):'',proofText:usdtProofText(m,o,o.proof.trim()).slice(0,120),proofImage:o.img||'',status:'pending',source:'site'};
    if(CLOUD&&S.user&&S.user.uid){rec.uid=S.user.uid;var wpx=coWalletPart();if(wpx)rec.walletPart=wpx}
    createOrderRec(rec).then(function(){saveMyPhone(o)},function(e){console.warn('order log failed',e);if(rec.walletPart)toast('ما قدرنا نخصم من رصيدك، الطلب لازم يندفع كامل')});
  }
  if(o.fromCart){CART=[];saveCart()}
  var sh=S.cosheet,no=o.no,sendImg=o.img&&!(CLOUD&&logsOrders());
  setTimeout(function(){if(!sh||sh.closed)return;S.co=null;sh.set('<div class="done"><div class="done-ic">'+svg('check',32)+'</div><h3>انسجل طلبك</h3><p>رقم طلبك <b dir="ltr">'+esc(no)+'</b>. كمّل الإرسال على واتساب'+(sendImg?' وابعت سكرين الحوالة بالمحادثة':'')+'، وبنفعّلك الاشتراك أول ما نتأكد من الحوالة.</p><a class="btn wa block lg" href="'+esc(href)+'" target="_blank" rel="noopener">'+svg('chat')+' افتح واتساب مرة ثانية</a><p class="fine">إذا ما انفتح واتساب، راسلنا على <span class="sel" dir="ltr">'+esc(waPretty())+'</span></p><button class="btn block" data-close>تمام</button></div>','تم إرسال الطلب')},60);
}

  if(o.email.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email.trim())){box.textContent='الإيميل مش مكتوب صح.';box.hidden=false;return}
  box.hidden=true;o.paying=true;el.disabled=true;el.innerHTML='جاري الدفع…';
  var units=[];lines.forEach(function(x){for(var i=0;i<x.qty;i++)units.push(x)});
  var res=[],stop=false;
  units.reduce(function(p,x){return p.then(function(){if(stop)return;return buyUnit(x,o).then(function(r){res.push({x:x,r:r})},function(e){console.warn('walletBuy',e);stop=true;res.push({x:x,e:e})})})},Promise.resolve()).then(function(){

function buyUnit(x,o){
  var it={productId:x.p.id,productName:String(x.p.name).slice(0,100),planId:x.plan.id,planName:String(x.plan.name).slice(0,60),price:+x.plan.price,qty:1,planIndex:x.p.plans.indexOf(x.plan)};

  if(!x.plan.instant)return DB.walletBuy(uid,it,meta,null);

    ids=ids.sort(function(){return Math.random()-.5}).slice(0,3);

    return DB.loadPrivate().then(function(p){S.costs=p.costs||{};adminRefresh()})}).catch(fail);
  DB.loadPeople().then(function(m){S.people=m||{};adminRefresh()},function(e){console.warn('people',e)});
  S.aw.push(DB.watchOrders(function(list){S.orders=list;adminRefresh()}));
  S.aw.push(DB.watchReviewsA(function(l){S.reviewsA=l;adminRefresh()}));
  if(CLOUD){
    S.aw.push(DB.watchTopups(function(l){S.topups=l;adminRefresh()}));
    S.aw.push(DB.watchWallets(function(l){S.wallets=l;adminRefresh()}));
    S.aw.push(DB.watchStock(function(l){S.stock=l;adminRefresh();refreshStock()}));
    S.aw.push(DB.watchTickets(function(l){S.tickets=l;S.tkErr=false;adminRefresh()},function(){S.tkErr=true;adminRefresh()}));
  }
}
function onUser(u){
  S.authKnown=true;S.uw=stopWatch(S.uw);S.aw=stopWatch(S.aw);S.adminOn=false;
  S.user=u;payUserChanged(u);S.wallet=null;S.myOrders=[];S.myTopups=[];S.myReviews=[];S.myTickets=[];refreshSupBadge();
  S.isAdmin=!!u&&CLOUD&&!!CFG.adminEmail&&String(u.email||'').toLowerCase()===String(CFG.adminEmail).toLowerCase();
  if(!u||!S.isAdmin){S.orders=[];S.costs={};S.topups=[];S.wallets=[];S.stock=[];S.reviewsA=[]}
  if(u&&walletOn()&&B.page!=='admin'){
    DB.ensureWallet(u).catch(function(e){console.warn('ensureWallet',e)});
    S.uw.push(DB.watchWallet(u.uid,function(w){S.wallet=w;if(S.co&&w){if(!S.co.name)S.co.name=w.name||'';if(!S.co.phone)S.co.phone=w.phone||''}refreshHeader();refreshAccount();refreshCheckout()}));
    resumeCo();
    S.uw.push(DB.watchMyOrders(u.uid,function(l){S.myOrders=l;refreshAccount()}));
    S.uw.push(DB.watchMyTopups(u.uid,function(l){S.myTopups=l;refreshAccount()}));
    S.uw.push(DB.watchMyReviews(u.uid,function(l){S.myReviews=l;refreshAccount()}));
    S.uw.push(DB.watchMyTickets(u.uid,function(l){S.tkErr=!l;S.myTickets=l||[];refreshSupBadge();if(S.sup&&S.sup.view==='home')renderSupport()}));
  }
  if(S.view==='admin')render();
  else{refreshHeader();refreshAccount(true);refreshCheckout()}
}
/* ----- fast path: read the public store data (settings + products) with one small REST call ----- */
function fsv(v){if(!v)return null;if('stringValue' in v)return v.stringValue;if('integerValue' in v)return +v.integerValue;if('doubleValue' in v)return v.doubleValue;if('booleanValue' in v)return v.booleanValue;if('nullValue' in v)return null;if('timestampValue' in v)return Date.parse(v.timestampValue);if('arrayValue' in v)return (v.arrayValue.values||[]).map(fsv);if('mapValue' in v){var o={},f=v.mapValue.fields||{};for(var k in f)o[k]=fsv(f[k]);return o}return null}
function restPublic(){var f=CFG.firebase,base='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(f.projectId)+'/databases/(default)/documents/',k='key='+encodeURIComponent(f.apiKey);
  function get(u){return fetch(u,{credentials:'omit'}).then(function(r){if(!r.ok)throw new Error('rest '+r.status);return r.json()})}
  return Promise.all([get(base+'settings/main?'+k),get(base+'products?pageSize=300&'+k)]).then(function(r){
    var st=fsv({mapValue:r[0]});if(!st)throw new Error('rest empty');
    var prods=((r[1]&&r[1].documents)||[]).map(function(d){var x=fsv({mapValue:d})||{};x.id=String(d.name||'').split('/').pop();return x});
    return {settings:st,products:prods}})}
function boot(){
  S.view=wantView();
  var cached=CLOUD?store('hazem-cache-v2'):null;
  if(cached&&cached.settings){applyPublic(cached);S.loaded=true}
  render();themeMeta();rvStart();
  var restP=CLOUD&&B.page!=='admin'&&window.fetch?restPublic().then(function(pub){applyPublic(pub);cachePublic();S.restOk=true;S.loaded=true;render();if(/^#p-/.test(location.hash||''))handleStoreHash()},function(e){console.warn('rest',e&&e.message)}):Promise.resolve();
  DB.init().then(function(){
    S.dbReady=true;
    return restP.then(function(){if(S.restOk)return;return DB.loadPublic().then(function(pub){applyPublic(pub);cachePublic()},function(e){console.error(e);if(!cached)S.loadError=true})});
  }).catch(function(e){console.error(e);S.loadError=true}).then(function(){
    if(!S.restOk||!S.loaded){S.loaded=true;render()}if(S.view==='store')handleStoreHash();setTimeout(payBoot,700);
    if(B.page!=='admin')loadReviews();
    try{DB.onAuth(onUser)}catch(e){console.error(e);S.authKnown=true;render()}
  });
}
boot();
})();
